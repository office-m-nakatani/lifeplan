<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空き家サポート 顧客管理（社内用）｜香川あんしん空き家サポート</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      ink:'#243B33', sub:'#5F7268', line:'#E2E9E3', paper:'#F5F8F5', card:'#FFFFFF',
      grn:'#2E9E68', grnL:'#E7F6EC', org:'#F0862B', orgL:'#FFF1DE',
      sky:'#4FA6D5', skyL:'#EAF6FC', vio:'#8B5CF6', red:'#E5484D', amber:'#F5A524'
    },
    fontFamily: { sans:['"Noto Sans JP"','sans-serif'] }
  } }
}
</script>
<style>
  body { font-family:'Noto Sans JP',sans-serif; color:#243B33; background:#F5F8F5; }
  .kanban::-webkit-scrollbar{ height:10px } .kanban::-webkit-scrollbar-thumb{ background:#CBD9CE; border-radius:9999px }
  [x-cloak]{ display:none }
  .tabbtn.active{ background:#2E9E68; color:#fff }
  .softshadow{ box-shadow:0 6px 20px -10px rgba(36,59,51,.25) }
  select,input,textarea{ background:#fff }
</style>
</head>
<body class="text-ink">

<!-- ===== ヘッダー ===== -->
<header class="sticky top-0 z-40 bg-white border-b border-line">
  <div class="max-w-[1400px] mx-auto px-3 sm:px-5 h-14 flex items-center gap-3">
    <div class="flex items-center gap-2 shrink-0">
      <svg class="w-7 h-7 text-grn" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-7 9 7M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
      <div class="leading-tight">
        <p class="font-black text-sm sm:text-base">空き家サポート 顧客管理</p>
        <p class="text-[10px] text-sub -mt-0.5">社内用・チーム連携ボード</p>
      </div>
    </div>
    <nav id="tabs" class="flex items-center gap-1 ml-auto text-xs sm:text-sm font-bold overflow-x-auto">
      <button data-view="inbox"     class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">受信リード</button>
      <button data-view="kanban"    class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">解体パイプライン</button>
      <button data-view="partner"   class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">分野別ボード</button>
      <button data-view="dashboard" class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">ダッシュボード</button>
    </nav>
    <div class="flex items-center gap-1.5 shrink-0">
      <label class="hidden sm:flex items-center gap-1 text-[10px] text-sub font-bold">表示役割
        <select id="roleSel" onchange="setRole(this.value)" class="text-xs font-bold border border-line rounded-full px-2.5 py-1.5 bg-paper"></select>
      </label>
      <button id="newBtn" onclick="openNew()" class="bg-grn text-white text-xs sm:text-sm font-bold px-3 py-2 rounded-full hover:opacity-90 whitespace-nowrap">＋ 新規案件</button>
      <div class="relative">
        <button onclick="toggleMenu()" class="w-9 h-9 rounded-full border border-line flex items-center justify-center hover:bg-paper" title="データ">
          <svg class="w-5 h-5 text-sub" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6h.01M12 12h.01M12 18h.01"/></svg>
        </button>
        <div id="menu" class="hidden absolute right-0 mt-1 w-64 bg-white border border-line rounded-xl softshadow p-1.5 text-sm z-50">
          <p class="text-[10px] text-sub font-bold px-3 pt-1.5 pb-0.5">提携先との連携</p>
          <button onclick="openShareModal()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">提携先へ送る（分野を選んで書き出し）</button>
          <button onclick="document.getElementById('receiveFile').click()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">提携先データを受け取る（担当モードで開く）</button>
          <button onclick="document.getElementById('returnFile').click()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">提携先からの更新を反映（社内）</button>
          <div class="border-t border-line my-1"></div>
          <p class="text-[10px] text-sub font-bold px-3 pt-0.5 pb-0.5">データ</p>
          <button onclick="exportJSON()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">全データをJSONで書き出し（バックアップ）</button>
          <button onclick="document.getElementById('importFile').click()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">JSONを読み込み（統合）</button>
          <button onclick="loadSeed(true)" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">デモ用サンプルを再読み込み</button>
          <button onclick="wipe()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper text-red">全データを消去</button>
        </div>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importJSON(event)">
    <input type="file" id="receiveFile" accept="application/json" class="hidden" onchange="receiveShare(event)">
    <input type="file" id="returnFile" accept="application/json" class="hidden" onchange="applyReturn(event)">
  </div>
</header>
<div id="roleBar" class="hidden"></div>

<main id="app" class="max-w-[1400px] mx-auto px-3 sm:px-5 py-5"></main>

<!-- ===== 詳細オーバーレイ ===== -->
<div id="detail" class="hidden fixed inset-0 z-50 bg-paper overflow-y-auto">
  <div id="detailBody"></div>
</div>

<!-- ===== 新規/取り込みモーダル ===== -->
<div id="newModal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-start sm:items-center justify-center p-3 overflow-y-auto">
  <div class="bg-white rounded-2xl w-full max-w-2xl softshadow my-4">
    <div class="flex items-center justify-between px-5 py-3 border-b border-line sticky top-0 bg-white rounded-t-2xl">
      <p class="font-black">新規案件を追加</p>
      <button onclick="closeNew()" class="text-sub hover:text-ink text-xl leading-none">×</button>
    </div>
    <div id="newBody" class="p-5"></div>
  </div>
</div>

<!-- ===== 提携先へ送るモーダル ===== -->
<div id="shareModal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-start sm:items-center justify-center p-3 overflow-y-auto">
  <div class="bg-white rounded-2xl w-full max-w-lg softshadow my-4">
    <div class="flex items-center justify-between px-5 py-3 border-b border-line">
      <p class="font-black">提携先へデータを送る</p>
      <button onclick="closeShare()" class="text-sub hover:text-ink text-xl leading-none">×</button>
    </div>
    <div id="shareBody" class="p-5"></div>
  </div>
</div>

<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] bg-ink text-white text-sm font-bold px-5 py-3 rounded-full softshadow"></div>

<script>
/* ============================================================
   設定（統合仕様より）
   ============================================================ */
const STAGES = [
  { key:'lead',        label:'反響・リード',   color:'#6B7280' },
  { key:'contact',     label:'初回接触',       color:'#0EA5E9' },
  { key:'survey',      label:'現地調査',       color:'#14B8A6' },
  { key:'estimate',    label:'見積提出',       color:'#F59E0B' },
  { key:'negotiation', label:'商談・条件調整', color:'#F97316' },
  { key:'contract',    label:'契約',           color:'#8B5CF6' },
  { key:'pre_work',    label:'着工前準備',     color:'#6366F1' },
  { key:'construction',label:'施工中',         color:'#3B82F6' },
  { key:'completed',   label:'完工・引渡',     color:'#10B981' },
  { key:'aftercare',   label:'アフター・横展開',color:'#22C55E' },
  { key:'closed_lost', label:'失注・長期保留', color:'#DC2626' },
];
const stageIndex = k => STAGES.findIndex(s => s.key === k);
const stageMeta  = k => STAGES.find(s => s.key === k) || STAGES[0];
const OPEN_STAGES = STAGES.filter(s => s.key !== 'closed_lost');

/* 6分野（解体は背骨なので別扱い。順不同で動く支援ドメイン） */
const DOMAINS = [
  { key:'inheritance_reg', label:'相続登記', role:'司法書士', color:'#2E9E68', site:'https://www.jiroshiho.com/', siteName:'提携司法書士サイト',
    stages:['未判定','名義確認','相続人確定','遺産分割協議','相続登記申請','完了'] },
  { key:'demolition_reg',  label:'滅失登記', role:'土地家屋調査士', color:'#0EA5E9',
    stages:['未判定','解体完了待ち','書類交付','申請（完工＋1ヶ月）','完了'] },
  { key:'tax',             label:'税務', role:'税理士', color:'#F0862B',
    stages:['未判定','課税論点の洗い出し','3000万控除の判定','固定資産税の試算','申告サポート','完了'] },
  { key:'realestate',      label:'不動産', role:'不動産会社', color:'#8B5CF6', site:'https://www.sunestate-inc.jp/', siteName:'提携不動産サイト',
    stages:['未判定','査定','売り方決定','媒介契約','売買契約','決済・完了'] },
  { key:'construction_ext',label:'エクステリア・造成・新築', role:'自社/工務店', color:'#4FA6D5', site:'https://www.midorizouen.jp/category/notice', siteName:'提携エクステリア会社サイト',
    stages:['未判定','活用意向・再建築可否','プラン提示','見積・設計','契約','着手・完了'] },
  { key:'fp',              label:'資金・補助金（FP）', role:'FP', color:'#F59E0B',
    stages:['未判定','資金ヒアリング','補助金の該当確認','資金計画','資金確保完了'] },
];
/* 提携先サイトへのリンク（新しいタブ・ユーザー指定URL） */
function domainSiteLink(dm){
  if(!dm.site) return '';
  return `<a href="${dm.site}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()" title="${dm.siteName||'提携先サイト'}を新しいタブで開く" class="inline-flex items-center gap-1 text-xs font-bold rounded-full px-2.5 py-1 hover:opacity-80" style="color:${dm.color};background:${dm.color}14">
    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5a1 1 0 00-1 1v12a1 1 0 001 1h12a1 1 0 001-1v-8.5M15 4h5m0 0v5m0-5L10 14"/></svg>
    提携先サイト
  </a>`;
}
const domainMeta = k => DOMAINS.find(d => d.key === k);

/* 分野ステータス（未要件どおり：不要は理由を残す／必要はスタンバイ〜対応中を派生） */
const NEEDS = {
  undetermined:{ label:'未判定', color:'#8A98A5', bg:'#EEF1F4' },
  required:    { label:'必要',   color:'#2E9E68', bg:'#E7F6EC' },
  not_required:{ label:'不要',   color:'#8A98A5', bg:'#F1F4F2' },
  hold:        { label:'保留',   color:'#F0862B', bg:'#FFF1DE' },
};
/* 必要ドメインの「今どの局面か」を派生（対応中／完了のみのシンプル表示） */
function domainPhase(dkey, d){
  if(!d) return { key:'undetermined', label:'未判定', color:'#8A98A5', bg:'#EEF1F4' };
  if(d.need==='not_required') return { key:'not_required', label:'不要', color:'#8A98A5', bg:'#F1F4F2' };
  if(d.need==='hold')         return { key:'hold', label:'保留', color:'#F0862B', bg:'#FFF1DE' };
  if(d.need==='undetermined') return { key:'undetermined', label:'未判定', color:'#8A98A5', bg:'#EEF1F4' };
  // required
  const meta = domainMeta(dkey);
  const last = meta.stages[meta.stages.length-1];
  if(d.stage === last) return { key:'done', label:'完了', color:'#16794C', bg:'#DCF1E5' };
  return { key:'active', label:'対応中', color:'#2E9E68', bg:'#E7F6EC' };
}

/* 表示ラベル */
const L = {
  source:{}, // free
  structure:{ wood:'木造', lightSteel:'軽量鉄骨', heavySteel:'重量鉄骨', rc:'RC造', other:'その他' },
  floors:{ '1f':'平屋', '2f':'2階建て', '3f':'3階建て以上' },
  era:{ new:'2006年以降', mid:'1990〜2005年', old:'1989年以前', unknown:'不明' },
  road:{ wide:'広い(4m以上)', mid:'軽なら通れる(2〜4m)', narrow:'狭い(2m未満)', unknown:'不明' },
  garden:{ none:'外構ほぼなし', few:'少なめ', normal:'一般的', many:'多め' },
  zanchi:{ empty:'ほぼ空', half:'半分ほど', full:'満載' },
  owner:{ self:'ご本人', deceased:'故人のまま', unknown:'不明' },
  exit:{ sell:'売却', use:'活用', undecided:'未定' },
  urgencyLevel:{ '高':'高', '中':'中', '低':'低' },
};
const lab = (grp,k) => (L[grp] && L[grp][k]) || k || '—';
const urgColor = lv => lv==='高' ? '#E5484D' : lv==='中' ? '#F0862B' : '#2E9E68';

/* ============================================================
   ストレージ
   ============================================================ */
const KEY = 'akiya_crm_v1';
let DB = [];
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function load(){
  try { DB = JSON.parse(localStorage.getItem(KEY)) || []; }
  catch(e){ DB = []; }
  if(!DB.length) loadSeed(false);
}
function getC(id){ return DB.find(c => c.id === id); }
function upsert(c){ const i = DB.findIndex(x => x.id===c.id); if(i>=0) DB[i]=c; else DB.push(c); save(); }

/* ============================================================
   役割（アクセス制御）— 社内は全権、提携先は自分の分野だけ編集可
   ============================================================ */
const ROLE_DEFS = {
  admin:            { label:'社内（全権）',        domain:null,               color:'#243B33' },
  inheritance_reg:  { label:'司法書士',            domain:'inheritance_reg',  color:'#2E9E68' },
  demolition_reg:   { label:'土地家屋調査士',      domain:'demolition_reg',   color:'#0EA5E9' },
  tax:              { label:'税理士',              domain:'tax',              color:'#F0862B' },
  realestate:       { label:'不動産',              domain:'realestate',       color:'#8B5CF6' },
  construction_ext: { label:'エクステリア・造成',  domain:'construction_ext', color:'#4FA6D5' },
  fp:               { label:'FP（資金・補助金）',  domain:'fp',               color:'#F59E0B' },
};
let ROLE = localStorage.getItem('akiya_crm_role') || 'admin';
if(!ROLE_DEFS[ROLE]) ROLE = 'admin';
function isAdmin(){ return ROLE === 'admin'; }
function roleDomain(){ return ROLE_DEFS[ROLE].domain; }
function canEditDomain(dkey){ return isAdmin() || roleDomain() === dkey; }
function canEditCore(){ return isAdmin(); }               // 商談ステージ・お客様情報・注意点は社内のみ
/* 提携先には「自分の分野が必要」な案件だけを見せる */
function scope(){ if(isAdmin()) return DB; const dk = roleDomain(); return DB.filter(c => c.domains?.[dk]?.need==='required'); }

function setRole(r){
  if(!ROLE_DEFS[r]) return;
  if(r!=='admin' && !confirm(ROLE_DEFS[r].label+'モードに切り替えます。\n自分の分野（'+(domainMeta(ROLE_DEFS[r].domain)?.label||'')+'）以外は閲覧のみになります。よろしいですか？')) { applyRoleUI(); return; }
  ROLE = r; localStorage.setItem('akiya_crm_role', r);
  applyRoleUI(); if(openId){ renderDetail(); } render();
}
function applyRoleUI(){
  const sel = document.getElementById('roleSel'); if(sel) sel.value = ROLE;
  const nb = document.getElementById('newBtn'); if(nb) nb.style.display = isAdmin() ? '' : 'none';
  const bar = document.getElementById('roleBar');
  if(bar){
    if(isAdmin()){ bar.className = 'hidden'; bar.innerHTML=''; }
    else {
      const d = ROLE_DEFS[ROLE];
      bar.className = 'text-white';
      bar.style.background = d.color;
      bar.innerHTML = `<div class="max-w-[1400px] mx-auto px-4 py-2 flex items-center gap-2 text-sm font-bold flex-wrap">
        <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        ${d.label}モードで表示中：<span class="font-normal">担当分野「${domainMeta(d.domain)?.label||''}」のみ編集できます。他はすべて閲覧のみです。</span>
        <button onclick="exportReturn()" class="ml-auto bg-white/20 hover:bg-white/30 rounded-full px-4 py-1.5">自分の更新を書き出して返信</button>
      </div>`;
    }
  }
}

/* ============================================================
   提携先とのデータ共有（費用ゼロ＝ファイルの受け渡し）
   ============================================================ */
function download(text, name){
  const blob = new Blob([text], {type:'application/json'});
  const a = document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download = name; a.click();
}
/* 社内→提携先：指定分野が必要な案件だけを、役割タグ付きで書き出す */
function shareToPartner(role, cases){
  const payload = { type:'akiya_crm_share', role, exportedAt: todayISO(), cases: JSON.parse(JSON.stringify(cases)) };
  download(JSON.stringify(payload,null,2), '空き家CRM_'+(ROLE_DEFS[role]?.label||role)+'_'+todayISO()+'.json');
  toast(ROLE_DEFS[role].label+'向けに'+cases.length+'件を書き出しました');
}
function openShareModal(caseId){
  shareCaseId = caseId || null;
  const only = caseId ? getC(caseId) : null;
  document.getElementById('shareBody').innerHTML = `
    <p class="text-sm text-sub mb-3">${only?('「'+esc(only.name||'')+'様」の案件を、'):'該当案件を'}選んだ提携先へ送るファイルを作成します。<br>提携先はそのファイルを顧客管理ページで読み込むと、<strong class="text-ink">自分の分野だけ編集できる状態</strong>で開きます。</p>
    <div class="space-y-1.5">
      ${DOMAINS.map(dm=>{
        const n = (caseId?[only]:DB).filter(c=>c && c.domains?.[dm.key]?.need==='required').length;
        return `<button onclick="doShare('${dm.key}')" ${n?'':'disabled'} class="w-full flex items-center gap-2 border border-line rounded-xl px-3 py-2.5 text-left ${n?'hover:border-grn':'opacity-40'}">
          <span class="w-3 h-3 rounded-full" style="background:${dm.color}"></span>
          <span class="font-bold text-sm flex-1">${dm.label}<span class="text-sub font-normal">（${dm.role}）</span></span>
          <span class="text-xs text-sub">${n}件</span>
          <svg class="w-4 h-4 text-sub" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v12m0 0l-4-4m4 4l4-4M4 20h16"/></svg>
        </button>`;
      }).join('')}
    </div>
    <p class="text-[11px] text-sub mt-3">※ ファイルにはお客様情報が含まれます。送付先を確認のうえ、メール等でお送りください（このツールから自動送信はしません）。</p>`;
  document.getElementById('shareModal').classList.remove('hidden');
}
let shareCaseId = null;
function closeShare(){ document.getElementById('shareModal').classList.add('hidden'); }
function doShare(role){
  const base = shareCaseId ? [getC(shareCaseId)] : DB;
  const cases = base.filter(c => c && c.domains?.[role]?.need==='required');
  if(!cases.length){ toast('該当案件がありません'); return; }
  shareToPartner(role, cases);
  closeShare();
}
/* 提携先が受け取る：役割つきファイルを読み込み、担当モードで開く */
function receiveShare(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try {
    const p = JSON.parse(r.result);
    if(p.type!=='akiya_crm_share' || !Array.isArray(p.cases) || !ROLE_DEFS[p.role]) throw 0;
    if(!confirm(ROLE_DEFS[p.role].label+'として'+p.cases.length+'件を受け取ります。\nこの端末の表示データは受け取った内容に置き換わります（元に戻す場合はサンプル再読み込み）。続けますか？')) return;
    DB = p.cases; save();
    ROLE = p.role; localStorage.setItem('akiya_crm_role', ROLE);
    applyRoleUI(); setView('partner');
    toast(ROLE_DEFS[p.role].label+'モードで'+p.cases.length+'件を読み込みました');
  } catch(err){ toast('この共有ファイルを読み込めませんでした'); } };
  r.readAsText(f); e.target.value=''; toggleMenu();
}
/* 提携先→社内：自分の更新を書き出す（自分の分野のみが後で反映される） */
function exportReturn(){
  if(isAdmin()){ toast('提携先モードのときに使えます'); return; }
  const dk = roleDomain();
  const cases = DB.filter(c => c.domains?.[dk]?.need==='required');
  shareToPartner(ROLE, cases);
}
/* 社内が反映：提携先の返信ファイルから「その分野だけ」を安全にマージ（他分野は上書きしない） */
function applyReturn(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try {
    const p = JSON.parse(r.result);
    if(p.type!=='akiya_crm_share' || !Array.isArray(p.cases) || !ROLE_DEFS[p.role]) throw 0;
    const dk = ROLE_DEFS[p.role].domain; let upd=0, notes=0;
    p.cases.forEach(pc=>{
      const c = getC(pc.id); if(!c) return;
      if(dk && pc.domains?.[dk]){ c.domains[dk] = pc.domains[dk]; upd++; }
      (pc.followHistory||[]).forEach(h=>{
        if(!(c.followHistory||[]).some(x=>x.date===h.date && x.memo===h.memo)){ c.followHistory.unshift(h); notes++; }
      });
      upsert(c);
    });
    render();
    toast(ROLE_DEFS[p.role].label+'の更新を反映：'+upd+'件（新規メモ'+notes+'件）');
  } catch(err){ toast('この返信ファイルを反映できませんでした'); } };
  r.readAsText(f); e.target.value=''; toggleMenu();
}
function savedFlash(){ toast('✓ 保存しました'); }

/* ============================================================
   診断データ → 分野の自動フラグ（“見える化して次の出番が分かる”の核）
   ============================================================ */
function deriveDomains(c){
  const d = c.domains || {};
  const set = (k,v) => d[k] = Object.assign({ need:'undetermined', stage:'未判定', assignee:'', next:'', reason:'' }, d[k], v);

  // 相続登記（司法書士）
  if(c.owner==='deceased') set('inheritance_reg',{ need:'required', stage:d.inheritance_reg?.stage||'名義確認', next:'戸籍収集・相続人確定' });
  else if(c.owner==='unknown') set('inheritance_reg',{ need:'required', stage:d.inheritance_reg?.stage||'名義確認', next:'登記簿取得で名義確定' });
  else set('inheritance_reg',{ need:'not_required', reason:'名義がご本人のため登記不要' });

  // 滅失登記（土地家屋調査士）＝建物ありは必ず後工程で発生
  set('demolition_reg',{ need:'required', stage:d.demolition_reg?.stage||'解体完了待ち', next:'解体完了を待って申請（完工＋1ヶ月）' });

  // 税務（税理士）
  if(c.exit==='sell' || c.owner==='deceased') set('tax',{ need:'required', stage:d.tax?.stage||'課税論点の洗い出し', next:'3000万控除の可否・固定資産税の確認' });
  else set('tax',{ need:'undetermined', next:'固定資産税（住宅用地特例の解除）は後続で確認' });

  // 不動産
  if(c.exit==='sell') set('realestate',{ need:'required', stage:d.realestate?.stage||'査定', next:'現況／更地の両建て査定' });
  else if(c.exit==='use') set('realestate',{ need:'not_required', reason:'活用予定のため売却不要' });
  else set('realestate',{ need:'undetermined', next:'出口未定。査定を見て判断' });

  // エクステリア・造成・新築
  if(c.exit==='use') set('construction_ext',{ need:'required', stage:d.construction_ext?.stage||'活用意向・再建築可否', next:'活用プランと再建築可否の確認' });
  else if(c.exit==='sell') set('construction_ext',{ need:'not_required', reason:'更地渡し・売却のため活用なし' });
  else set('construction_ext',{ need:'undetermined', next: c.garden==='many' ? '外構多め＝再整備需要のシグナル' : '' });

  // FP（資金・補助金）
  const high = (Number(c.estimateRangeLow)||0) >= 150 || c.urgencyLevel==='高';
  if(high) set('fp',{ need:'required', stage:d.fp?.stage||'資金ヒアリング', next:'解体費と自己資金・補助金の確認' });
  else set('fp',{ need:'undetermined', next:'' });

  c.domains = d;
  return c;
}

/* ============================================================
   次の戦略エンジン（案件→推奨アクション配列）
   ============================================================ */
function strategyFor(c){
  const out = [];
  const si = stageIndex(c.stage);
  const contacted = (c.followHistory||[]).some(h => h.type && h.type!=='自動起票');
  const pastNext = c.nextActionDate && c.nextActionDate < todayISO();

  if(c.stage==='lead' && c.urgencyLevel==='高' && !contacted)
    out.push({lv:'高', t:'当日中（緊急度「高」は4時間以内）に一次架電。不通ならSMS＋メールで現地調査の候補日を提示。相見積が始まる前に押さえる。'});
  if(c.owner==='deceased' && si < stageIndex('contract'))
    out.push({lv:'高', t:'名義が故人のまま。相続登記（司法書士）を前工程で先行し、名義が片付く／相続人全員の同意が取れるまで契約・着工はブロック。現地調査に司法書士を同席。'});
  if(c.owner==='unknown')
    out.push({lv:'高', t:'名義が不明。まず司法書士が登記簿を取得して名義を確定。確定まで契約は保留。'});
  if(c.stage==='survey')
    out.push({lv:'高', t:'現地調査の結果（地中埋設物・石綿・私道掘削承諾・残置物）を反映した「確定レンジ見積」へ更新。診断概算からの差分理由を明示。'});
  if(c.exit==='sell')
    out.push({lv:'高', t:'即解体に走らず、不動産査定（現況／更地）と税理士の3000万円控除の可否判定を並行で起票。更地渡しか古家付きかで自社解体の要否を確定。'});
  if(c.exit==='sell' && c.era==='old' && c.owner==='deceased')
    out.push({lv:'高', t:'被相続人居住用財産3000万円特別控除の本命。相続開始から3年目の年末を逆算し、相続登記→解体→滅失→売買のクリティカルパスを設定。実建築年（1981/5/31以前か）を現地確認のうえ税理士へ。'});
  if(c.exit==='use')
    out.push({lv:'中', t:'エクステリア／造成／新築を起票。解体〜造成を同一重機・仮設で連結受注し原価圧縮。着手前に再建築可否（接道2m・セットバック・用途地域・調整区域）を確認。'});
  if((Number(c.estimateRangeLow)||0) >= 150 && c.urgencyLevel==='高')
    out.push({lv:'中', t:'資金ネックの典型パターン。FPを起票し、空き家解体ローン＋市町補助金の該当を着工前に確認（交付決定前の着工は対象外）。'});
  if((c.stage==='estimate'||c.stage==='negotiation') && pastNext)
    out.push({lv:'中', t:'見積提出後にサイレントの懸念。値引き合戦ではなく工期確約・登記/補助金ワンストップ・産廃適正処理で追客。'});
  if(c.stage==='completed')
    out.push({lv:'高', t:'完工。滅失登記（土地家屋調査士）を完工＋1ヶ月以内で起票、税理士へ固定資産税（住宅用地特例の解除）を通知、出口（売却／活用）へ引継ぎ。3つ同時に発火。'});
  if(c.subsidyApplicable==='該当あり')
    out.push({lv:'中', t:'補助金は交付決定後に着工する工程で組む（着工後は申請不可の自治体が多い）。着工前準備に「補助金申請済？」ゲートを立てる。'});

  const order = {'高':0,'中':1,'低':2};
  return out.sort((a,b)=> order[a.lv]-order[b.lv]);
}

/* ============================================================
   フォロー漏れアラート
   ============================================================ */
function daysSince(iso){ if(!iso) return null; return Math.floor((Date.now() - new Date(iso+'T00:00:00').getTime())/86400000); }
function alertsFor(c){
  const a = [];
  const open = c.stage !== 'closed_lost';
  const si = stageIndex(c.stage);
  const contacted = (c.followHistory||[]).some(h => h.type && h.type!=='自動起票');

  if(c.stage==='lead' && open){
    const d = daysSince(c.createdAt);
    if(c.urgencyLevel==='高' && !contacted && d!==null && d>=1) a.push({lv:'red', t:'緊急度「高」の新規リードが未接触のまま放置'});
    else if(!contacted && d!==null && d>=1) a.push({lv:'amber', t:'新規リードが24時間以上未接触'});
  }
  if(open && c.nextActionDate && c.nextActionDate < todayISO())
    a.push({lv:'amber', t:'次アクション日を超過（'+c.nextActionDate+'）'});
  if((c.owner==='deceased'||c.owner==='unknown') && si>=stageIndex('contract') && c.domains?.inheritance_reg?.stage!=='完了')
    a.push({lv:'red', t:'名義が未解決のまま契約以降へ進行（着工不可ブロック）'});
  if((c.stage==='completed'||c.stage==='aftercare') && c.demolitionDate){
    const d = daysSince(c.demolitionDate);
    if(c.domains?.demolition_reg?.stage!=='完了'){
      if(d!==null && d>=30) a.push({lv:'red', t:'滅失登記が期限（完工＋1ヶ月）を超過'});
      else if(d!==null && d>=20) a.push({lv:'amber', t:'滅失登記の期限が接近（完工＋1ヶ月）'});
    }
  }
  if(c.exit==='sell' && c.owner==='deceased' && c.inheritanceStartDate){
    const y = new Date(c.inheritanceStartDate+'T00:00:00').getFullYear();
    const deadline = new Date(y+3, 11, 31);
    const left = Math.ceil((deadline - Date.now())/86400000);
    if(left<=30) a.push({lv:'red', t:'3000万円控除の期限が残り'+left+'日'});
    else if(left<=90) a.push({lv:'amber', t:'3000万円控除の期限が残り'+left+'日'});
  }
  // 必要分野が未着手
  DOMAINS.forEach(dm => {
    const d = c.domains?.[dm.key];
    if(open && d && d.need==='required' && (!d.stage || d.stage==='未判定')){
      const ds = daysSince(c.createdAt);
      if(ds!==null && ds>=7) a.push({lv:'amber', t:dm.label+'（'+dm.role+'）が必要判定のまま未着手'});
    }
  });
  // 出口ハンドオフ漏れ
  if(open && c.exit==='sell' && (c.domains?.realestate?.need==='undetermined' || c.domains?.tax?.need==='undetermined'))
    a.push({lv:'amber', t:'売却なのに不動産／税理士が未起票'});
  return a;
}

    <button onclick="discardLeads()" class="text-xs text-sub underline">破棄</button>
  </div>`;
}
function mapLead(l){
  const c = {
    id:'AK-'+new Date().getFullYear()+'-'+String(l.ts||Date.now()).slice(-5),
    createdAt: l.date || todayISO(),
    source: l.kind==='form' ? '問い合わせフォーム' : '60秒診断',
    name:l.name||'', phone:l.phone||'', email:l.email||'', city:l.city||'',
    desiredConsult:(l.consult||'').slice(0,400), assignee:'', teamNote:'',
    stage:'lead', nextAction:'一次架電・ヒアリング', nextActionDate: todayISO(),
    structure:l.structure||'wood', tsubo:Number(l.tsubo)||null, floors:l.floors||'2f',
    era:l.era||'unknown', road:l.road||'unknown', garden:l.garden||'normal', zanchi:l.zanchi||'half',
    owner:l.owner||'self', exit:l.exit||'undecided',
    urgencyLevel:l.urgencyLevel||'中', urgencyScore:l.urgencyScore||null,
    estimateRangeLow: l.total ? Math.round(l.total*0.85/10000) : null,
    estimateRangeHigh: l.total ? Math.round(l.total*1.15/10000) : null,
    finalEstimate:null, subsidyApplicable:'未確認', asbestosSurvey:'未実施',
    demolitionDate:null, inheritanceStartDate:null, domains:{},
    followHistory:[{date:todayISO(), type:'メモ', memo:'LP診断からの自動読み取りで起票'}], lostReason:null, notes:''
  };
  deriveDomains(c);
  return c;
}
function importLeads(){
  const q = inboxLeads(); if(!q.length) return;
  q.forEach(l => upsert(mapLead(l)));
  localStorage.removeItem('akiya_crm_inbox');
  render(); toast(q.length+'件を自動取り込みしました');
}
function discardLeads(){
  if(!confirm('LPからの新着データを破棄しますか？')) return;
  localStorage.removeItem('akiya_crm_inbox'); render();
}

/* ============================================================
   ルーティング / 描画
   ============================================================ */
let VIEW = 'inbox';
function setView(v){ VIEW = v; document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.view===v)); render(); }
document.getElementById('tabs').addEventListener('click', e => { const b=e.target.closest('.tabbtn'); if(b) setView(b.dataset.view); });

function render(){
  const app = document.getElementById('app');
  let html = '';
  if(VIEW==='inbox') html = renderInbox();
  else if(VIEW==='kanban') html = renderKanban();
  else if(VIEW==='partner') html = renderPartner();
  else if(VIEW==='dashboard') html = renderDashboard();
  app.innerHTML = bannerHTML() + html;
}

function badge(text, color, bg){ return `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full" style="color:${color};background:${bg}">${text}</span>`; }
function domainDots(c){
  return DOMAINS.map(dm=>{
    const ph = domainPhase(dm.key, c.domains?.[dm.key]);
    const on = ['required','active','standby','done'].includes(ph.key) || (c.domains?.[dm.key]?.need==='required');
    const col = ph.key==='not_required' ? '#D6DDD7' : (c.domains?.[dm.key]?.need==='required' ? dm.color : (ph.key==='hold' ? '#F0862B' : '#D6DDD7'));
    return `<span title="${dm.label}：${ph.label}" class="w-2.5 h-2.5 rounded-full inline-block" style="background:${col}"></span>`;
  }).join('');
}
function alertPip(c){
  const a = alertsFor(c);
  if(!a.length) return '';
  const red = a.some(x=>x.lv==='red');
  return `<span class="text-[10px] font-black px-1.5 py-0.5 rounded-full" style="color:#fff;background:${red?'#E5484D':'#F5A524'}">${a.length}</span>`;
}

function renderPartner(){
  const doms = isAdmin() ? DOMAINS : DOMAINS.filter(dm => dm.key === roleDomain());
  const blocks = doms.map(dm=>{
    const rel = DB.filter(c=>c.stage!=='closed_lost' && c.domains?.[dm.key]?.need==='required');

    rel.forEach(c=>{ const p = domainPhase(dm.key, c.domains[dm.key]); (groups[p.key]||(groups[p.key]=[])).push(c); });
    const chip = (c)=>{
      const d = c.domains[dm.key];
      return `<div class="bg-white border border-line rounded-lg px-3 py-2 mb-1.5 cursor-pointer hover:border-grn" onclick="openDetail('${c.id}')">
        <div class="flex items-center justify-between gap-2">
          <p class="font-bold text-sm truncate">${esc(c.name||'')}</p>
          <span class="text-[10px] text-sub">${stageMeta(c.stage).label}</span>
        </div>
        <p class="text-[11px] text-sub">${esc(c.city||'')}／担当:${esc(d.assignee||'未割当')}</p>
        ${d.next?`<p class="text-[11px] text-ink mt-0.5">→ ${esc(d.next)}</p>`:''}
        <p class="text-[10px] mt-0.5" style="color:${dm.color}">分野ステージ: ${esc(d.stage||'未判定')}</p>
      </div>`;
    };
    const section = (title,col,arr)=> arr.length?`<div class="mb-2"><p class="text-[11px] font-bold mb-1" style="color:${col}">${title}（${arr.length}）</p>${arr.map(chip).join('')}</div>`:'';
    return `<div class="bg-paper rounded-2xl border border-line p-3">
      <div class="flex items-center gap-2 mb-3 flex-wrap">
        <span class="w-3 h-3 rounded-full" style="background:${dm.color}"></span>

        <span class="text-[11px] text-sub">${dm.role}</span>

        <span class="text-[11px] text-sub ml-auto">対応中 ${groups.active.length}件</span>
      </div>
      ${section('対応中','#2E9E68',groups.active)}
      ${section('完了','#16794C',groups.done)}
      ${(!groups.active.length&&!groups.done.length)?'<p class="text-[11px] text-sub">担当案件なし</p>':''}
    </div>`;
  }).join('');
  return `
  <div class="flex items-center justify-between mb-3">
    <h2 class="font-black text-lg">${isAdmin()?'分野別ボード':'あなたの担当案件'}</h2>
    <p class="text-[11px] text-sub">各分野の担当が、自分の対応中案件と完了案件を一覧できます。</p>
  </div>
  <div class="grid ${isAdmin()?'md:grid-cols-2 xl:grid-cols-3':'max-w-2xl'} gap-3">${blocks}</div>`;
}

/* ---- ダッシュボード ---- */
function renderDashboard(){
  const base = scope();
  const open = base.filter(c=>c.stage!=='closed_lost');
  const leads = base.filter(c=>c.stage==='lead').length;
  const pipelineYen = open.reduce((s,c)=> s + (Number(c.estimateRangeLow)||0), 0);
  const won = base.filter(c=>stageIndex(c.stage)>=stageIndex('contract') && c.stage!=='closed_lost').length;
  const lost = base.filter(c=>c.stage==='closed_lost').length;
  const rate = (won+lost)>0 ? Math.round(won/(won+lost)*100) : 0;
  const urgent = open.filter(c=>c.urgencyLevel==='高').length;

  // アラート集約
  const allAlerts = [];
  base.forEach(c=> alertsFor(c).forEach(a=> allAlerts.push({c,a})));
  allAlerts.sort((x,y)=> (x.a.lv==='red'?0:1)-(y.a.lv==='red'?0:1));

  const tile = (label,val,sub,col)=>`<div class="bg-white rounded-2xl border border-line p-4">
    <p class="text-[11px] text-sub font-bold">${label}</p>
    <p class="font-black text-2xl mt-1" style="color:${col||'#243B33'}">${val}</p>
    ${sub?`<p class="text-[11px] text-sub mt-0.5">${sub}</p>`:''}</div>`;

  // ステージ別件数
  const stageBars = OPEN_STAGES.map(s=>{
    const n = DB.filter(c=>c.stage===s.key).length;
    const w = open.length? Math.round(n/Math.max(1,open.length)*100):0;
    return `<div class="flex items-center gap-2 text-xs">
      <span class="w-24 shrink-0 text-sub">${s.label}</span>
      <div class="flex-1 bg-paper rounded-full h-3 overflow-hidden"><div style="width:${Math.max(3,w)}%;background:${s.color}" class="h-3"></div></div>
      <span class="w-6 text-right font-bold">${n}</span>
    </div>`;
  }).join('');

  // 分野別稼働
  const domLoad = DOMAINS.map(dm=>{
    const n = open.filter(c=>c.domains?.[dm.key]?.need==='required').length;
    return `<div class="flex items-center gap-2 text-xs"><span class="w-2.5 h-2.5 rounded-full" style="background:${dm.color}"></span><span class="flex-1">${dm.label}<span class="text-sub">（${dm.role}）</span></span><span class="font-bold">${n}</span></div>`;
  }).join('');

  const alertList = allAlerts.length ? allAlerts.map(({c,a})=>`
    <div class="flex items-center gap-2 px-3 py-2 border-b border-line last:border-0 hover:bg-paper cursor-pointer" onclick="openDetail('${c.id}')">
      <span class="w-2 h-2 rounded-full shrink-0" style="background:${a.lv==='red'?'#E5484D':'#F5A524'}"></span>
      <span class="font-bold text-sm w-32 truncate">${esc(c.name||'')}</span>
      <span class="text-[11px] text-sub w-20 shrink-0">${stageMeta(c.stage).label}</span>
      <span class="text-[13px] flex-1">${esc(a.t)}</span>
    </div>`).join('') : '<p class="px-3 py-6 text-center text-sub text-sm">フォロー漏れアラートはありません。</p>';

  return `
  <h2 class="font-black text-lg mb-3">ダッシュボード</h2>
  <div class="grid grid-cols-2 lg:grid-cols-5 gap-3 mb-4">
    ${tile('受信リード（未対応）', leads+'件', '要初回接触', leads?'#E5484D':'#2E9E68')}
    ${tile('進行中の案件', open.length+'件','','#243B33')}
    ${tile('パイプライン概算', '¥'+pipelineYen+'万','下限合計','#2E9E68')}
    ${tile('成約率', rate+'%', '成約'+won+'／失注'+lost)}
    ${tile('緊急度「高」', urgent+'件','', urgent?'#E5484D':'#2E9E68')}
  </div>
  <div class="grid lg:grid-cols-3 gap-3">
    <div class="bg-white rounded-2xl border border-line p-4 lg:col-span-1">
      <p class="font-black text-sm mb-3">ステージ別 件数</p><div class="space-y-2">${stageBars}</div>
    </div>
    <div class="bg-white rounded-2xl border border-line p-4 lg:col-span-1">
      <p class="font-black text-sm mb-3">分野別 稼働案件</p><div class="space-y-2">${domLoad}</div>
    </div>
    <div class="bg-white rounded-2xl border border-line lg:col-span-1 overflow-hidden">
      <p class="font-black text-sm px-4 pt-4 pb-2">フォロー漏れアラート <span class="text-sub font-bold">${allAlerts.length}</span></p>
      <div>${alertList}</div>
    </div>
  </div>`;
}

/* ============================================================
   詳細（編集）
   ============================================================ */
let openId = null;
function openDetail(id){ openId = id; document.getElementById('detail').classList.remove('hidden'); renderDetail(); }
function closeDetail(){ document.getElementById('detail').classList.add('hidden'); openId=null; render(); }
document.getElementById('detail').addEventListener('click', e=>{ if(e.target.id==='detail') closeDetail(); });

function field(id,key,value){ if(!canEditCore()) return; const c=getC(id); c[key]=value; upsert(c); savedFlash(); renderDetail(); }
function fieldNoRerender(id,key,value){ if(!canEditCore()) return; const c=getC(id); c[key]=value; upsert(c); savedFlash(); }
function domField(id,dkey,prop,value){ if(!canEditDomain(dkey)) return; const c=getC(id); c.domains[dkey]=c.domains[dkey]||{need:'undetermined',stage:'未判定',assignee:'',next:'',reason:''}; c.domains[dkey][prop]=value; upsert(c); savedFlash(); renderDetail(); }
function addFollow(id){
  const c=getC(id);
  const type=document.getElementById('fh-type').value;
  const memo=document.getElementById('fh-memo').value.trim();
  if(!memo) return;
  c.followHistory=c.followHistory||[];
  const who = isAdmin() ? '' : '【'+ROLE_DEFS[ROLE].label+'】';
  c.followHistory.unshift({date:todayISO(), type, memo: who+memo});
  upsert(c); savedFlash(); renderDetail();
}

function renderDetail(){
  const c = getC(openId); if(!c) return;
  const si = stageIndex(c.stage);
  const sMeta = stageMeta(c.stage);
  const isLost = c.stage==='closed_lost';
  const prog = isLost ? 0 : Math.round(si/(OPEN_STAGES.length-1)*100);
  const strat = strategyFor(c);
  const al = alertsFor(c);
  const stageOpts = STAGES.map(s=>`<option value="${s.key}" ${c.stage===s.key?'selected':''}>${s.label}</option>`).join('');

  /* --- 商談ステッパー（大きめ・クリックで移動） --- */
  const stepper = OPEN_STAGES.map((s,i)=>{
    const done = !isLost && i < si, cur = !isLost && i===si;
    return `<button ${canEditCore()?`onclick="field('${c.id}','stage','${s.key}')"`:'disabled'} title="${s.label}" class="flex flex-col items-center gap-1.5 shrink-0" style="min-width:72px">
      <span class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-black transition-all" style="background:${cur?s.color:(done?'#DCF1E5':'#EEF1F4')};color:${cur?'#fff':(done?'#16794C':'#8A98A5')};${cur?'box-shadow:0 0 0 4px '+s.color+'33':''}">${done?'✓':i+1}</span>
      <span class="text-[10px] leading-tight text-center ${cur?'font-black':'text-sub'}">${s.label.replace('・','<br>')}</span>
    </button>`;
  }).join('<span class="flex-1 h-0.5 bg-line self-start mt-[17px] min-w-[8px]"></span>');

  /* --- 次の戦略 --- */
  const stratHtml = strat.length ? strat.map(s=>{
    const col = s.lv==='高'?'#E5484D':s.lv==='中'?'#F0862B':'#2E9E68';
    const bg  = s.lv==='高'?'#FDECEC':s.lv==='中'?'#FFF1DE':'#E7F6EC';
    return `<div class="rounded-xl px-4 py-3 mb-2" style="background:${bg}"><p class="text-sm leading-relaxed"><span class="font-black" style="color:${col}">［${s.lv}］</span> ${esc(s.t)}</p></div>`;

  /* --- 6分野（1行1分野・進捗バーつき・役割で編集可否） --- */

  const domainRows = DOMAINS.map(dm=>{
    const d = c.domains?.[dm.key] || {need:'undetermined',stage:'未判定',assignee:'',next:'',reason:''};

    const stageSel = dm.stages.map(s=>`<option ${d.stage===s?'selected':''}>${s}</option>`).join('');
    const stIdx = dm.stages.indexOf(d.stage);

function val(id){ const e=document.getElementById(id); return e?e.value:''; }
function parsePaste(){
  const raw = val('paste').trim(); if(!raw) return;
  // JSON優先
  try {
    const j = JSON.parse(raw);
    const map = {city:'n-city',structure:'n-structure',tsubo:'n-tsubo',floors:'n-floors',era:'n-era',road:'n-road',garden:'n-garden',zanchi:'n-zanchi',owner:'n-owner',exit:'n-exit'};
    Object.keys(map).forEach(k=>{ if(j[k]!=null){ const e=document.getElementById(map[k]); if(e) e.value=j[k]; } });
    if(j.urgencyLevel){ const e=document.getElementById('n-urg'); if(e) e.value=j.urgencyLevel; }
    if(j.total){ document.getElementById('n-lo').value=Math.round(j.total*0.85/10000); document.getElementById('n-hi').value=Math.round(j.total*1.15/10000); }
    toast('診断JSONを取り込みました'); return;
  } catch(e){}
  // テキスト（LPの診断サマリー／相談メール形式を全項目パース）
  const m = (re)=>{ const x=raw.match(re); return x?x[1].trim():''; };
  const put = (id,v)=>{ if(v){ const e=document.getElementById(id); if(e) e.value=v; } };
  put('n-name',  m(/お名前[:：]\s*(.+)/));
  put('n-phone', m(/電話[:：]\s*(.+)/));
  put('n-email', m(/メール[:：]\s*(.+)/));
  put('n-city',  m(/所在地[:：]\s*(.+)/));
  const tsubo = m(/約(\d+)坪/); put('n-tsubo', tsubo);
  const pickKey = (grp, text) => { for(const k of Object.keys(L[grp])){ if(text.includes(L[grp][k])) return k; } return ''; };
  put('n-structure', pickKey('structure', raw));
  if(/平屋/.test(raw)) put('n-floors','1f'); else if(/3階/.test(raw)) put('n-floors','3f'); else if(/2階/.test(raw)) put('n-floors','2f');
  if(/2006年以降/.test(raw)) put('n-era','new'); else if(/1990/.test(raw)) put('n-era','mid'); else if(/1989年以前/.test(raw)) put('n-era','old'); else if(/築年不明/.test(raw)) put('n-era','unknown');
  if(/広い（4m|広い\(4m/.test(raw)) put('n-road','wide'); else if(/軽なら通れる/.test(raw)) put('n-road','mid'); else if(/狭い（2m|狭い\(2m/.test(raw)) put('n-road','narrow'); else if(/前面道路[:：]不明/.test(raw)) put('n-road','unknown');
  if(/外構ほぼなし/.test(raw)) put('n-garden','none'); else if(/外構少なめ/.test(raw)) put('n-garden','few'); else if(/外構多め/.test(raw)) put('n-garden','many'); else if(/外構一般的/.test(raw)) put('n-garden','normal');
  if(/残置物ほぼなし/.test(raw)) put('n-zanchi','empty'); else if(/残置物ほぼそのまま/.test(raw)) put('n-zanchi','full'); else if(/残置物/.test(raw)) put('n-zanchi','half');
  if(/亡くなった|故人/.test(raw)) put('n-owner','deceased');
  else if(/名義は不明|名義[:：]不明/.test(raw)) put('n-owner','unknown');
  else if(/名義はご本人/.test(raw)) put('n-owner','self');
  if(/売却/.test(raw)) put('n-exit','sell'); else if(/活用/.test(raw)) put('n-exit','use');
  const rng = raw.match(/概算[:：]\s*([0-9,]+)万〜([0-9,]+)万/);
  if(rng){ put('n-lo', rng[1].replace(/,/g,'')); put('n-hi', rng[2].replace(/,/g,'')); }
  const consult = m(/希望する相談[:：]\s*(.+)/); if(consult) put('n-consult','【希望】'+consult);
  toast('診断テキストから全項目を取り込みました（内容をご確認ください）');
}

function exportJSON(){

  a.download = '空き家CRM_'+todayISO()+'.json'; a.click(); toggleMenu(); toast('書き出しました');

function importJSON(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try {
    const arr = JSON.parse(r.result); if(!Array.isArray(arr)) throw 0;
    const ids = new Set(DB.map(c=>c.id));
    let add=0,upd=0; arr.forEach(c=>{ if(ids.has(c.id)){ const i=DB.findIndex(x=>x.id===c.id); DB[i]=c; upd++; } else { DB.push(c); add++; } });
    save(); render(); toast(`統合：新規${add}件・更新${upd}件`);
  } catch(err){ toast('読み込みに失敗しました（JSON形式をご確認ください）'); } };
  r.readAsText(f); e.target.value=''; toggleMenu();
}

function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.add('hidden'),2200); }
