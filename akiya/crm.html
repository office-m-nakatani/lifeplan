<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 外部送信の遮断（万一のスクリプト混入でもfetch/XHR/WSで顧客データを外に出せない） -->
<meta http-equiv="Content-Security-Policy" content="connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; img-src data:;">
<title>士業ワンストップ 顧客管理｜お客様を登録して必要な専門家へお繋ぎ</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<script>
tailwind.config = {
  theme: { extend: {
    colors: {
      ink:'#243B33', sub:'#5F7268', line:'#E2E9E3', paper:'#F5F8F5', card:'#FFFFFF',
      grn:'#2E9E68', grnL:'#E7F6EC', org:'#F0862B', orgL:'#FFF1DE',
      sky:'#4FA6D5', skyL:'#EAF6FC', vio:'#8B5CF6', red:'#E5484D', amber:'#F5A524'
    },
    fontFamily: { sans:['"Noto Sans JP"','sans-serif'] }
  } }
}
</script>
<style>
  body { font-family:'Noto Sans JP',sans-serif; color:#243B33; background:#F5F8F5; }
  .kanban::-webkit-scrollbar{ height:10px } .kanban::-webkit-scrollbar-thumb{ background:#CBD9CE; border-radius:9999px }
  [x-cloak]{ display:none }
  .tabbtn.active{ background:#2E9E68; color:#fff }
  .softshadow{ box-shadow:0 6px 20px -10px rgba(36,59,51,.25) }
  select,input,textarea{ background:#fff }
</style>
</head>
<body class="text-ink">

<!-- ===== ヘッダー ===== -->
<header class="sticky top-0 z-40 bg-white border-b border-line">
  <div class="max-w-[1400px] mx-auto px-3 sm:px-5 py-2 sm:py-0 sm:h-14 flex flex-wrap sm:flex-nowrap items-center gap-x-3 gap-y-2">
    <div class="flex items-center gap-2 shrink-0">
      <svg class="w-7 h-7 text-grn" fill="none" stroke="currentColor" stroke-width="1.6" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 11l9-7 9 7M5 10v9a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1v-9"/></svg>
      <div class="leading-tight">
        <p class="font-black text-sm sm:text-base">士業ワンストップ 顧客管理</p>
        <p class="text-[10px] text-sub -mt-0.5">お客様を登録して、必要な専門家へお繋ぎ</p>
      </div>
    </div>
    <nav id="tabs" class="order-last sm:order-none w-full sm:w-auto flex items-center gap-1 sm:ml-auto text-xs sm:text-sm font-bold overflow-x-auto">
      <button data-view="today"     class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">今日</button>
      <button data-view="inbox"     class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">受信リード</button>
      <button data-view="kanban"    class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">進捗ボード</button>
      <button data-view="partner"   class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">分野別ボード</button>
      <button data-view="dashboard" class="tabbtn px-3 py-1.5 rounded-full border border-line whitespace-nowrap">ダッシュボード</button>
    </nav>
    <div class="relative shrink-0 hidden md:block">
      <input id="searchBox" placeholder="氏名・電話・市町で検索" autocomplete="off"
        class="w-40 lg:w-56 text-sm border border-line rounded-full px-3.5 py-1.5 bg-paper focus:outline-none focus:border-grn">
      <div id="searchDrop" class="hidden absolute right-0 mt-1 w-80 bg-white border border-line rounded-xl softshadow p-1 z-50 max-h-96 overflow-y-auto"></div>
    </div>
    <div class="flex items-center gap-1.5 shrink-0 ml-auto sm:ml-0">
      <label id="roleWrap" class="hidden sm:flex items-center gap-1 text-[10px] text-sub font-bold">表示役割
        <select id="roleSel" onchange="setRole(this.value)" class="text-xs font-bold border border-line rounded-full px-2.5 py-1.5 bg-paper"></select>
      </label>
      <button id="newBtn" onclick="openNew()" class="bg-grn text-white text-xs sm:text-sm font-bold px-3 py-2 rounded-full hover:opacity-90 whitespace-nowrap">＋ 新規案件</button>
      <div class="relative">
        <button onclick="toggleMenu()" class="w-9 h-9 rounded-full border border-line flex items-center justify-center hover:bg-paper" title="データ">
          <svg class="w-5 h-5 text-sub" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6h.01M12 12h.01M12 18h.01"/></svg>
        </button>
        <div id="menu" class="hidden absolute right-0 mt-1 w-64 bg-white border border-line rounded-xl softshadow p-1.5 text-sm z-50">
          <p class="text-[10px] text-sub font-bold px-3 pt-1.5 pb-0.5">提携先との連携</p>
          <button data-admin onclick="openShareModal()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">提携先へ送る（分野を選んで書き出し）</button>
          <button onclick="document.getElementById('receiveFile').click()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">提携先データを受け取る（担当モードで開く）</button>
          <button data-admin onclick="document.getElementById('returnFile').click()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">提携先からの更新を反映（社内）</button>
          <button onclick="openShareLog()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">共有履歴（提供記録）</button>
          <div class="border-t border-line my-1"></div>
          <p class="text-[10px] text-sub font-bold px-3 pt-0.5 pb-0.5">データ</p>
          <button onclick="exportJSON()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">全データをJSONで書き出し（バックアップ）</button>
          <button data-admin onclick="document.getElementById('importFile').click()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">JSONを読み込み（統合）</button>
          <button onclick="restorePrev()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">直前のデータに戻す（受信前へ復元）</button>
          <button data-admin onclick="loadSeed(true)" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper">デモ用サンプルを再読み込み</button>
          <button data-admin onclick="wipe()" class="w-full text-left px-3 py-2 rounded-lg hover:bg-paper text-red">全データを消去</button>
        </div>
      </div>
    </div>
    <input type="file" id="importFile" accept="application/json" class="hidden" onchange="importJSON(event)">
    <input type="file" id="receiveFile" accept="application/json" class="hidden" onchange="receiveShare(event)">
    <input type="file" id="returnFile" accept="application/json" class="hidden" onchange="applyReturn(event)">
  </div>
</header>
<div id="roleBar" class="hidden"></div>

<main id="app" class="max-w-[1400px] mx-auto px-3 sm:px-5 py-5"></main>

<!-- ===== 詳細オーバーレイ ===== -->
<div id="detail" class="hidden fixed inset-0 z-50 bg-paper overflow-y-auto">
  <div id="detailBody"></div>
</div>

<!-- ===== 新規/取り込みモーダル ===== -->
<!-- ⚠ items-center にすると縦長の中身のとき上端が画面外へ出てスクロールで戻れなくなる（お名前欄に到達できない事故があった）。
     常に items-start ＋ カード側を max-h/overflow-y-auto にして、中身が伸びてもフォーム先頭に必ず到達できるようにする -->
<div id="newModal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-start justify-center p-3 overflow-y-auto">
  <div class="bg-white rounded-2xl w-full max-w-2xl softshadow my-4 max-h-[calc(100vh-2rem)] overflow-y-auto">
    <div class="flex items-center justify-between px-5 py-3 border-b border-line sticky top-0 bg-white rounded-t-2xl z-10">
      <p id="newTitle" class="font-black">新規案件を追加</p>
      <button onclick="closeNew()" class="text-sub hover:text-ink text-xl leading-none">×</button>
    </div>
    <div id="newBody" class="p-5"></div>
  </div>
</div>

<!-- ===== 提携先へ送るモーダル ===== -->
<div id="shareModal" class="hidden fixed inset-0 z-50 bg-black/40 flex items-start justify-center p-3 overflow-y-auto">
  <div class="bg-white rounded-2xl w-full max-w-lg softshadow my-4 max-h-[calc(100vh-2rem)] overflow-y-auto">
    <div class="flex items-center justify-between px-5 py-3 border-b border-line">
      <p class="font-black">提携先との共有</p>
      <button onclick="closeShare()" class="text-sub hover:text-ink text-xl leading-none">×</button>
    </div>
    <div id="shareBody" class="p-5"></div>
  </div>
</div>

<div id="toast" class="hidden fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] bg-ink text-white text-sm font-bold px-5 py-3 rounded-full softshadow"></div>

<script>
/* ============================================================
   設定（統合仕様より）
   ============================================================ */
/* お客様の進捗（どの士業が入口でも共通。解体固有の工程は「解体工事」分野の中に持つ） */
const STAGES = [
  { key:'lead',        label:'相談受付',       color:'#6B7280' },
  { key:'contact',     label:'初回接触',       color:'#0EA5E9' },
  { key:'hearing',     label:'ヒアリング・現状把握', color:'#14B8A6' },
  { key:'proposal',    label:'提案・お見積',   color:'#F59E0B' },
  { key:'contract',    label:'受任・ご契約',   color:'#8B5CF6' },
  { key:'progress',    label:'対応中',         color:'#3B82F6' },
  { key:'completed',   label:'完了・お引渡し', color:'#10B981' },
  { key:'aftercare',   label:'アフター・横展開',color:'#22C55E' },
  { key:'closed_lost', label:'終了・長期保留', color:'#DC2626' },
];
/* 旧（解体専用）ステージからの読み替え。既存データを壊さず移行する */
const STAGE_ALIAS = { survey:'hearing', estimate:'proposal', negotiation:'proposal', pre_work:'progress', construction:'progress' };
const normStage = k => STAGE_ALIAS[k] || k;
const stageIndex = k => STAGES.findIndex(s => s.key === normStage(k));
const stageMeta  = k => STAGES.find(s => s.key === normStage(k)) || STAGES[0];
const OPEN_STAGES = STAGES.filter(s => s.key !== 'closed_lost');

/* ご相談の入口（複数選択可）。どの士業から入っても、ここから必要なチームを推奨する */
const CONSULT_TYPES = [
  { key:'inherit',  label:'相続・遺産分割',       color:'#2E9E68' },
  { key:'regist',   label:'登記（相続・滅失）',   color:'#0EA5E9' },
  { key:'tax',      label:'税務・確定申告',       color:'#F0862B' },
  { key:'sell',     label:'売却・査定',           color:'#8B5CF6' },
  { key:'demolish', label:'解体・空き家',         color:'#243B33' },
  { key:'use',      label:'活用・新築・外構',     color:'#4FA6D5' },
  { key:'money',    label:'資金・保険・補助金',   color:'#F59E0B' },
  { key:'other',    label:'その他のご相談',       color:'#8A98A5' },
];

/* 支援分野（すべて対等。解体もその1つ。順不同で動く） */
/* 分野ごとの規定の担当（担当セレクトの2択目。定義が無い分野は自由入力のみ） */
const DOM_ASSIGNEE = { inheritance_reg:'二朗さん', realestate:'瀬尾さん', construction_ext:'植原さん', fp:'中谷' };
const DOMAINS = [
  { key:'inheritance_reg', label:'相続登記', role:'司法書士', color:'#2E9E68',
    stages:['未判定','名義確認','相続人確定','遺産分割協議','相続登記申請','完了'] },
  { key:'demolition',      label:'解体工事', role:'解体業者・工務店', color:'#243B33',
    stages:['未判定','現地調査','見積提示','契約','着工前準備','施工中','完工'] },
  { key:'demolition_reg',  label:'滅失登記', role:'土地家屋調査士', color:'#0EA5E9',
    stages:['未判定','解体完了待ち','書類交付','申請（完工＋1ヶ月）','完了'] },
  { key:'tax',             label:'税務', role:'税理士', color:'#F0862B',
    stages:['未判定','課税論点の洗い出し','3000万控除の判定','固定資産税の試算','申告サポート','完了'] },
  { key:'realestate',      label:'不動産', role:'不動産会社', color:'#8B5CF6',
    stages:['未判定','査定','売り方決定','媒介契約','売買契約','決済・完了'] },
  { key:'construction_ext',label:'エクステリア・造成・新築', role:'自社/工務店', color:'#4FA6D5',
    stages:['未判定','活用意向・再建築可否','プラン提示','見積・設計','契約','着手・完了'] },
  { key:'fp',              label:'資金・保険・補助金（FP）', role:'FP・保険', color:'#F59E0B',
    stages:['未判定','資金ヒアリング','保険の確認','補助金の該当確認','資金計画','資金確保完了'] },
];
const domainMeta = k => DOMAINS.find(d => d.key === k);

/* 分野ステータス（未要件どおり：不要は理由を残す／必要はスタンバイ〜対応中を派生） */
const NEEDS = {
  undetermined:{ label:'未判定', color:'#8A98A5', bg:'#EEF1F4' },
  required:    { label:'必要',   color:'#2E9E68', bg:'#E7F6EC' },
  not_required:{ label:'不要',   color:'#8A98A5', bg:'#F1F4F2' },
  hold:        { label:'保留',   color:'#F0862B', bg:'#FFF1DE' },
};
/* 必要ドメインの「今どの局面か」を派生（対応中／完了のみのシンプル表示） */
function domainPhase(dkey, d){
  if(!d) return { key:'undetermined', label:'未判定', color:'#8A98A5', bg:'#EEF1F4' };
  if(d.need==='not_required') return { key:'not_required', label:'不要', color:'#8A98A5', bg:'#F1F4F2' };
  if(d.need==='hold')         return { key:'hold', label:'保留', color:'#F0862B', bg:'#FFF1DE' };
  if(d.need==='undetermined') return { key:'undetermined', label:'未判定', color:'#8A98A5', bg:'#EEF1F4' };
  // required
  const meta = domainMeta(dkey);
  const last = meta.stages[meta.stages.length-1];
  if(d.stage === last) return { key:'done', label:'完了', color:'#16794C', bg:'#DCF1E5' };
  return { key:'active', label:'対応中', color:'#2E9E68', bg:'#E7F6EC' };
}

/* 表示ラベル */
const L = {
  source:{}, // free
  structure:{ wood:'木造', lightSteel:'軽量鉄骨', heavySteel:'重量鉄骨', rc:'RC造', other:'その他' },
  floors:{ '1f':'平屋', '2f':'2階建て', '3f':'3階建て以上' },
  era:{ new:'2006年以降', mid:'1990〜2005年', old:'1989年以前', unknown:'不明' },
  road:{ wide:'広い(4m以上)', mid:'軽なら通れる(2〜4m)', narrow:'狭い(2m未満)', unknown:'不明' },
  garden:{ none:'外構ほぼなし', few:'少なめ', normal:'一般的', many:'多め' },
  zanchi:{ empty:'ほぼ空', half:'半分ほど', full:'満載' },
  owner:{ self:'ご本人', deceased:'故人のまま', unknown:'不明' },
  exit:{ sell:'売却', use:'活用', undecided:'未定' },
  urgencyLevel:{ '高':'高', '中':'中', '低':'低' },
  insuranceStatus:{ unknown:'未確認', active:'加入中', cancelPlanned:'解約予定日あり', cancelled:'解約済' },
  rightType:{ '':'不明', '所有権':'所有権', '借地':'借地' },
};
/* 表示用ラベル。辞書に無いキー（流入経路など自由入力）はそのまま出るので、必ずエスケープして返す */
const lab = (grp,k) => esc((L[grp] && L[grp][k]) || k || '—');
const urgColor = lv => lv==='高' ? '#E5484D' : lv==='中' ? '#F0862B' : '#2E9E68';
const uscore = c => c.urgencyScore!=null ? c.urgencyScore : ({'高':80,'中':50,'低':20}[c.urgencyLevel]||0);

/* ==== 共通ヘルパー（ID採番・電話正規化・入力検証・期限計算） ==== */
function newId(prefix){ return (prefix||'AK')+'-'+new Date().getFullYear()+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function nrmPhone(p){ return String(p||'').replace(/[^0-9]/g,''); }
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const ID_RE = /^[A-Za-z0-9_-]{1,40}$/;
function sanitizeCase(c){
  if(!c || typeof c!=='object') return c;
  if(!ID_RE.test(String(c.id||''))) c.id = newId();   // idはonclick属性に埋まるため、取込データは必ず安全な形へ再採番
  ['nextActionDate','inheritanceStartDate','demolitionDate','insuranceCancelDate','createdAt','referredAt','birthday'].forEach(k=>{ if(c[k] && !DATE_RE.test(String(c[k]))) c[k]=''; });
  if(c.stage) c.stage = normStage(c.stage);                                    // 旧（解体専用）ステージを読み替え
  if(!STAGES.some(s=>s.key===c.stage)) c.stage = 'lead';
  if(!Array.isArray(c.consultTypes)) c.consultTypes = [];
  c.consultTypes = c.consultTypes.filter(k => CONSULT_TYPES.some(t=>t.key===k)).slice(0,8);
  c.hasProperty = c.hasProperty === undefined ? !!(c.structure || c.owner || c.tsubo) : !!c.hasProperty;   // 旧データは物件ありとみなす
  if(c.family && typeof c.family==='object'){ c.family.spouse = !!c.family.spouse; c.family.children = Number(c.family.children)||0; c.family.note = String(c.family.note||'').slice(0,200); }
  ['kana','gender','mobile','zip','job','relation'].forEach(k=>{ if(c[k]!=null) c[k] = String(c[k]).slice(0,100); });
  if(c.urgencyLevel && !['高','中','低'].includes(c.urgencyLevel)) c.urgencyLevel='中';
  ['urgencyScore','estimateRangeLow','estimateRangeHigh','finalEstimate','builtYear','landArea','salePriceEstimate','tsubo'].forEach(k=>{ if(c[k]!=null && c[k]!==''){ const n=Number(c[k]); c[k]=isNaN(n)?null:n; } });
  (c.followHistory||[]).forEach(h=>{ if(h && h.date && !DATE_RE.test(String(h.date))) h.date=''; });
  Object.values(c.domains||{}).forEach(d=>{
    if(!d || typeof d!=='object') return;
    if(d.nextDate && !DATE_RE.test(String(d.nextDate))) d.nextDate='';
    if(!Object.prototype.hasOwnProperty.call(NEEDS, d.need)) d.need='undetermined';
    if('manualNeed' in d) d.manualNeed = !!d.manualNeed;
    if(d.decline && typeof d.decline==='object'){
      d.decline.reason = String(d.decline.reason||'').slice(0,200);
      if(!DATE_RE.test(String(d.decline.date||''))) d.decline.date='';
      if(!ROLE_DEFS[d.decline.by]) d.decline.by=null;
    } else if(d.decline) delete d.decline;
  });
  if(c.referredBy && !ROLE_DEFS[c.referredBy]) c.referredBy=null;
  if(c.thirdPartyConsent && typeof c.thirdPartyConsent==='object'){
    c.thirdPartyConsent.obtained = c.thirdPartyConsent.obtained===true;
    if(c.thirdPartyConsent.date && !DATE_RE.test(String(c.thirdPartyConsent.date))) c.thirdPartyConsent.date='';
    c.thirdPartyConsent.method = String(c.thirdPartyConsent.method||'').slice(0,100);
  }
  return c;
}
function calcJokoDeadline(c){  // 空き家3000万円特別控除の期限（相続開始から3年目の12/31）
  if(!(c.exit==='sell' && c.owner==='deceased' && c.inheritanceStartDate)) return null;
  const y = new Date(c.inheritanceStartDate+'T00:00:00').getFullYear();
  const deadline = new Date(y+3, 11, 31);
  return { dateStr:(y+3)+'-12-31', left: Math.ceil((deadline - Date.now())/86400000) };
}
function kyuTaishin(c){  // 旧耐震(1981/5/31以前)の判定シグナル：実建築年を最優先
  if(c.builtYear){ if(c.builtYear <= 1980) return {key:'yes', label:'旧耐震の可能性大（築'+c.builtYear+'年）', color:'#E5484D', bg:'#FDECEC'};
    if(c.builtYear === 1981) return {key:'check', label:'1981年築＝5/31前後の確認要', color:'#B45309', bg:'#FFF7E6'};
    return {key:'no', label:'新耐震（築'+c.builtYear+'年）', color:'#16794C', bg:'#DCF1E5'}; }
  if(c.era==='old') return {key:'check', label:'実建築年 未確認（1989年以前築）', color:'#B45309', bg:'#FFF7E6'};
  return null;
}
function addDaysISO(n){ const d=new Date(Date.now()+n*86400000); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }

/* ============================================================
   ストレージ
   ============================================================ */
const KEY = 'akiya_crm_v1';
let DB = [];
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function load(){
  try { DB = JSON.parse(localStorage.getItem(KEY)) || []; }
  catch(e){ DB = []; }
  if(!DB.length) loadSeed(false);
  else {
    // 旧バージョン（解体専用ステージ・お客様マスタなし・解体分野なし）のデータを新形式へ移行
    let changed = false;
    const OLD_STAGE_TO_DEMO = { survey:'現地調査', estimate:'見積提示', negotiation:'見積提示', contract:'契約', pre_work:'着工前準備', construction:'施工中', completed:'完工', aftercare:'完工' };
    DB.forEach(c=>{
      const before = c.stage;
      const wasDemolitionCase = !!(c.domains && c.domains.demolition_reg && !c.domains.demolition);   // 旧版は全件が解体案件
      const oldStage = c.stage;
      sanitizeCase(c);
      if(before!==c.stage) changed = true;
      if(wasDemolitionCase){
        // 解体を1分野に格下げしたため、旧案件には解体工事のドメインを補って解体業者から見えるようにする
        c.domains.demolition = { need:'required', manualNeed:true, stage: OLD_STAGE_TO_DEMO[oldStage] || '未判定',
          assignee:'', next: c.nextAction||'', reason:'', nextDate: c.nextActionDate||'' };
        if(!Array.isArray(c.consultTypes) || !c.consultTypes.length) c.consultTypes = ['demolish'];
        if(c.address && !c.propertyAddress) c.propertyAddress = c.address;   // 旧 address は物件所在地だった
        changed = true;
      }
    });
    if(changed) save();
  }
}
function getC(id){ return DB.find(c => c.id === id); }
function upsert(c){
  c.updatedAt = new Date().toISOString();
  const i = DB.findIndex(x => x.id===c.id);
  if(i>=0){
    const old = DB[i];
    // ID衝突の防波堤：同IDなのに氏名も電話も不一致なら別人の可能性
    if(old.name && c.name && old.name!==c.name && nrmPhone(old.phone) && nrmPhone(c.phone) && nrmPhone(old.phone)!==nrmPhone(c.phone)){
      if(!confirm('同じID（'+c.id+'）に別のお客様（'+c.name+'）を上書きしようとしています。\nOK＝上書き／キャンセル＝別IDで追加して両方残す')){
        c.id = newId(); DB.push(c); save(); return;
      }
    }
    DB[i]=c;
  } else DB.push(c);
  save();
}

/* ============================================================

   ============================================================ */
function download(text, name){
  const blob = new Blob([text], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
/* 役割別ホワイトリスト：渡してよい項目だけを抽出（個人情報の最小化） */
const CONTACT_ROLES = ['inheritance_reg','realestate','fp','tax','demolition'];   // 顧客接触が業務上必要な役割のみ連絡先を渡せる
function pickForRole(c, role, opts){
  opts = opts || {};
  const domainsSummary = {};
  Object.keys(c.domains||{}).forEach(k=>{
    if(k===role) return;
    const ph = domainPhase(k, c.domains[k]);
    domainsSummary[k] = { phase: ph.label, reason: c.domains[k].need==='not_required' ? (c.domains[k].reason||'') : undefined };
  });
  const roleLabel = ROLE_DEFS[role].label;
  const out = {
    id:c.id, name:c.name, kana:c.kana||'', city:c.city, stage:c.stage, createdAt:c.createdAt,
    // 何のご相談かは、動く専門家に必ず必要（お客様のプロフィール＝生年月日・職業・家族構成・自宅住所は渡さない）
    consultTypes: Array.isArray(c.consultTypes)?c.consultTypes.slice():[], hasProperty: !!c.hasProperty,
    desiredConsult: (c.desiredConsult||'').slice(0,400),
    owner:c.owner, exit:c.exit, era:c.era, structure:c.structure, tsubo:c.tsubo, floors:c.floors,
    // 物件の所在地は「不動産のご相談がある案件」のときだけ（お客様の自宅住所 c.address は共有しない）
    builtYear:c.builtYear??null, propertyAddress: c.hasProperty ? (c.propertyAddress||'') : '', chiban:c.chiban||'', landArea:c.landArea??null, rightType:c.rightType||'',
    inheritanceStartDate:c.inheritanceStartDate||null, demolitionDate:c.demolitionDate||null,
    subsidyApplicable:c.subsidyApplicable, insuranceStatus:c.insuranceStatus||'unknown', insuranceCancelDate:c.insuranceCancelDate||null,
    referredBy:c.referredBy||null,
    domains: { [role]: JSON.parse(JSON.stringify(c.domains?.[role]||{need:'required',stage:'未判定',assignee:'',next:'',reason:''})) },
    domainsSummary,
    followHistory: (c.followHistory||[]).filter(h => h.memo && (h.memo.startsWith('【'+roleLabel+'】') || !h.memo.startsWith('【'))).slice(0,30),
  };
  if(opts.teamNote) out.teamNote = c.teamNote||'';
  if(opts.contacts && CONTACT_ROLES.includes(role)){ out.phone = c.phone; out.mobile = c.mobile||''; out.email = c.email; }
  if(opts.estimate){ out.estimateRangeLow=c.estimateRangeLow; out.estimateRangeHigh=c.estimateRangeHigh; out.finalEstimate=c.finalEstimate; }
  return out;
  // notes（社内メモ）・緊急度スコアは常に共有しない
}
/* 社内→提携先：ホワイトリスト書き出し＋提供記録（個情法29条対応の運用ログ） */
function shareToPartner(role, cases, opts){
  opts = opts || {};
  const payload = { type:'akiya_crm_share', direction:'share', role, exportedAt: todayISO(),
    cases: cases.map(c => pickForRole(c, role, opts)) };
  download(JSON.stringify(payload,null,2), '空き家CRM_'+(ROLE_DEFS[role]?.label||role)+'宛_'+todayISO()+'.json');
  // 提供記録ログ
  let log = []; try { log = JSON.parse(localStorage.getItem('akiya_crm_sharelog'))||[]; } catch(e){}
  log.unshift({ date:todayISO(), role, roleLabel:ROLE_DEFS[role].label, count:cases.length,
    names:cases.map(c=>c.name||c.id), withContacts:!!opts.contacts, withTeamNote:!!opts.teamNote, withEstimate:!!opts.estimate });
  localStorage.setItem('akiya_crm_sharelog', JSON.stringify(log.slice(0,200)));
  // 各案件のフォロー履歴にも共有の事実を残す
  cases.forEach(sc=>{ const cc=getC(sc.id); if(cc){ cc.followHistory=cc.followHistory||[];
    cc.followHistory.unshift({date:todayISO(), type:'共有', memo:'【共有】'+ROLE_DEFS[role].label+'向けに書き出し'+(opts.contacts?'（連絡先含む）':'')}); upsert(cc); } });
  toast(ROLE_DEFS[role].label+'向けに'+cases.length+'件を書き出しました');
}

let shareCaseId = null;
function closeShare(){ document.getElementById('shareModal').classList.add('hidden'); }
function doShare(role){
  if(!isAdmin()){ toast('提携先への書き出しは事務局が行います'); return; }
  const base = shareCaseId ? [getC(shareCaseId)] : DB;
  const cases = base.filter(c => c && c.domains?.[role]?.need==='required');
  if(!cases.length){ toast('該当案件がありません'); return; }
  const opts = {
    contacts: !!document.getElementById('sh-contacts')?.checked,
    teamNote: !!document.getElementById('sh-teamnote')?.checked,
    estimate: !!document.getElementById('sh-estimate')?.checked,
  };
  // 第三者提供の同意ガード
  const noConsent = cases.filter(c => !(c.thirdPartyConsent && c.thirdPartyConsent.obtained));
  let finalCases = cases;
  if(noConsent.length){
    const names = noConsent.map(c=>c.name||c.id).join('、');
    if(confirm('第三者提供の同意が未記録の案件があります：'+names+'\n\nOK＝未同意の案件を除外して書き出す\nキャンセル＝全件このまま書き出す（口頭同意済み等の場合）')){
      finalCases = cases.filter(c => c.thirdPartyConsent && c.thirdPartyConsent.obtained);
      if(!finalCases.length){ toast('書き出す案件がありません（全件が同意未記録）'); return; }
    }
  }
  shareToPartner(role, finalCases, opts);
  closeShare();
}
/* 関わるチーム全員ぶんを一括書き出し（各社には各社の分だけ） */
function shareToAll(){
  if(!isAdmin()){ toast('提携先への書き出しは事務局が行います'); return; }
  const base = (shareCaseId ? [getC(shareCaseId)] : DB).filter(Boolean);
  const opts = {
    contacts: !!document.getElementById('sh-contacts')?.checked,
    teamNote: !!document.getElementById('sh-teamnote')?.checked,
    estimate: !!document.getElementById('sh-estimate')?.checked,
  };
  let targets = DOMAINS.map(dm => ({ dm, cases: base.filter(c=>c.domains?.[dm.key]?.need==='required') })).filter(t=>t.cases.length);
  if(!targets.length){ toast('共有ONの分野がありません'); return; }
  // 第三者提供の同意ガード（全体で1回だけ確認）
  const involved = base.filter(c => DOMAINS.some(dm=>c.domains?.[dm.key]?.need==='required'));
  const noConsent = involved.filter(c => !(c.thirdPartyConsent && c.thirdPartyConsent.obtained));
  if(noConsent.length){
    const names = noConsent.map(c=>c.name||c.id).join('、');
    if(confirm('第三者提供の同意が未記録の案件があります：'+names+'\n\nOK＝未同意の案件を除外して書き出す\nキャンセル＝全件このまま書き出す（口頭同意済み等の場合）')){
      const ex = new Set(noConsent.map(c=>c.id));
      targets = targets.map(t=>({ dm:t.dm, cases:t.cases.filter(c=>!ex.has(c.id)) })).filter(t=>t.cases.length);
      if(!targets.length){ toast('書き出す案件がありません（全件が同意未記録）'); return; }
    }
  }
  const summary = targets.map(t=>'・'+t.dm.label+'（'+t.dm.role+'）'+t.cases.length+'件').join('\n');
  if(!confirm(targets.length+'個のファイルを続けてダウンロードします。\n\n'+summary+'\n\nそれぞれの提携先へ、その1ファイルだけをお送りください。よろしいですか？')) return;
  closeShare();
  const plan = targets.map(t=>({ key:t.dm.key, ids:t.cases.map(c=>c.id) }));   // 書き出し時点の最新データを使う
  plan.forEach((t,i)=> setTimeout(()=>{
    const cases = t.ids.map(getC).filter(Boolean);
    if(cases.length) shareToPartner(t.key, cases, opts);
  }, i*500));
  setTimeout(()=> toast(targets.length+'分野ぶんのファイルを書き出しました（ダウンロードフォルダをご確認ください）'), targets.length*500+300);
}

/* 提携先が受け取る：全置換せずマージし、直前状態を自動退避。端末は担当モードに固定 */
function receiveShare(e){
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try {
    const p = JSON.parse(r.result);
    if(p.type!=='akiya_crm_share' || !Array.isArray(p.cases) || !ROLE_DEFS[p.role]) throw 0;
    if(p.direction==='return'){ toast('これは提携先からの返信ファイルです。「提携先からの更新を反映」からお使いください'); return; }
    if(isAdmin() && DB.length){
      if(!confirm('⚠ これは提携先の端末で使う機能です。\n社内端末で読み込むと表示データが置き換わり、この端末は提携先モードに固定されます。\n（提携先の返信を反映したい場合は「提携先からの更新を反映」を使ってください）\n\n本当に続行しますか？')) return;
    }
    if(localStorage.getItem('akiya_crm_dirty')){
      if(!confirm('未返信の更新があります。先に「自分の更新を書き出して返信」してから受信することをおすすめします。\nこのまま続行しますか？')) return;
    }
    if(!confirm(ROLE_DEFS[p.role].label+'として'+p.cases.length+'件を受け取ります。\n直前の状態にはメニューの「直前のデータに戻す」で復帰できます。続けますか？')) return;
    // 直前状態の自動退避（1スロット）＋バックアップの自動ダウンロード
    localStorage.setItem('akiya_crm_prev', JSON.stringify({savedAt:todayISO(), cases:DB}));
    if(DB.length) download(JSON.stringify(DB,null,2), '受信前バックアップ_'+todayISO()+'.json');
    const dk = ROLE_DEFS[p.role].domain;
    p.cases.forEach(pc=>{
      sanitizeCase(pc);
      const i = DB.findIndex(x=>x.id===pc.id);
      if(i>=0){
        const local = DB[i];
        // 自分の分野の編集とローカルのフォロー履歴は温存して統合
        const mine = local.domains?.[dk];
        pc.domains = pc.domains || {};
        if(mine && mine.updatedAt && (!pc.domains[dk]?.updatedAt || pc.domains[dk].updatedAt < mine.updatedAt)) pc.domains[dk] = mine;
        const seen = new Set((pc.followHistory||[]).map(h=>h.date+'|'+h.memo));
        (local.followHistory||[]).forEach(h=>{ if(!seen.has(h.date+'|'+h.memo)) (pc.followHistory=pc.followHistory||[]).push(h); });
        // 共有ファイルに無い項目（自分で登録したお客様のフリガナ・生年月日・ご家族など）はローカルを残す。
        // 全置換にすると、自分が登録したお客様の情報が痩せた共有版で消える
        DB[i] = Object.assign({}, local, pc);
      } else DB.push(pc);
      // 受信ファイルに無いローカル案件（自分の紹介など）は削除せず温存
    });
    save();
    ROLE = p.role; localStorage.setItem('akiya_crm_role', ROLE);
    localStorage.setItem('akiya_crm_locked_role', p.role);   // 端末を担当モードに固定（解除は正規の全データJSON読み込み）
    applyRoleUI(); setView('partner');
    toast(ROLE_DEFS[p.role].label+'モードで'+p.cases.length+'件を読み込みました');
  } catch(err){ toast('この共有ファイルを読み込めませんでした'); } };
  r.readAsText(f); e.target.value=''; toggleMenu();
}

}
/* 提携先→社内：自分の分野の更新＋自分からの紹介案件を返信ファイルに */
function exportReturn(){
  if(isAdmin()){ toast('提携先モードのときに使えます'); return; }
  const dk = roleDomain();
  const roleLabel = ROLE_DEFS[ROLE].label;
  // 自分が触った分野（申し送り・進捗更新）は need によらず必ず社内へ返す
  const mine = DB.filter(c => (c.domains?.[dk]?.need==='required' || c.domains?.[dk]?.updatedAt) && c.referredBy!==ROLE);
  let referrals = DB.filter(c => c.referredBy===ROLE);
  // 自分が登録したお客様＝社外へ個人情報を渡す行為なので、同意未記録は既定で除外
  const noConsent = referrals.filter(c => !(c.thirdPartyConsent && c.thirdPartyConsent.obtained));
  if(noConsent.length){
    const names = noConsent.map(c=>c.name||c.id).join('、');
    if(confirm('ご本人の同意が未記録のお客様がいます：'+names+'\n\nOK＝そのお客様を除いて送る（推奨）\nキャンセル＝このまま全員を送る（口頭で同意を得ている場合）')){
      const ex = new Set(noConsent.map(c=>c.id));
      referrals = referrals.filter(c=>!ex.has(c.id));
    }
  }
  if(referrals.length){   // 提携先側にも提供記録（誰の情報をいつ事務局へ渡したか）
    let log=[]; try { log = JSON.parse(localStorage.getItem('akiya_crm_sharelog'))||[]; } catch(e){}
    log.unshift({ date:todayISO(), role:'admin', roleLabel:'事務局', count:referrals.length,
      names:referrals.map(c=>c.name||c.id), withContacts:true, withTeamNote:true, withEstimate:false });
    localStorage.setItem('akiya_crm_sharelog', JSON.stringify(log.slice(0,200)));
  }
  const payload = { type:'akiya_crm_share', direction:'return', role:ROLE, exportedAt:todayISO(),
    cases: mine.map(c => ({
      id:c.id,
      domains:{ [dk]: c.domains[dk] },
      followHistory:(c.followHistory||[]).filter(h=>h.memo && h.memo.startsWith('【'+roleLabel+'】')),
      inheritanceStartDate:c.inheritanceStartDate||null
    })).concat(referrals.map(c=>JSON.parse(JSON.stringify(c)))) };
  download(JSON.stringify(payload,null,2), '空き家CRM_'+roleLabel+'_返信_'+todayISO()+'.json');
  localStorage.removeItem('akiya_crm_dirty');
  toast('返信ファイルを書き出しました（更新'+mine.length+'件・ご紹介'+referrals.length+'件）。メール等で事務局へお送りください');
}
/* 社内が反映：返信ファイルから「その分野だけ」安全にマージ＋紹介案件を新規受入 */
function applyReturn(e){
  if(!isAdmin()){ toast('返信の反映は事務局が行います'); e.target.value=''; return; }
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try {
    const p = JSON.parse(r.result);
    if(p.type!=='akiya_crm_share' || !Array.isArray(p.cases) || !ROLE_DEFS[p.role]) throw 0;
    if(p.direction && p.direction!=='return'){ toast('これは社内→提携先の送付ファイルです。反映には提携先の「返信」ファイルを選んでください'); return; }
    const dk = ROLE_DEFS[p.role].domain; let upd=0, conflict=0, notes=0, refs=0;
    p.cases.forEach(pc=>{
      sanitizeCase(pc);
      const c = getC(pc.id);
      if(!c){
        if(pc.referredBy){   // 提携先からの紹介案件を新規リードとして受入
          const dup = pc.phone && DB.find(x => nrmPhone(x.phone) && nrmPhone(x.phone)===nrmPhone(pc.phone));
          if(dup){
            dup.followHistory = dup.followHistory||[];
            dup.followHistory.unshift({date:todayISO(), type:'メモ', memo:'【紹介】'+ROLE_DEFS[p.role].label+'から紹介あり（既存案件と同一電話番号のため統合）'});
            upsert(dup);
          } else {
            pc.stage = pc.stage || 'lead';
            pc.domains = pc.domains || {};
            if(!Object.keys(pc.domains).length) deriveDomains(pc);   // 紹介元が設定した共有範囲（要否）は尊重する
            pc.referredBy = p.role;                                   // 申告値ではなくファイルの役割を採用
            // 同意は「紹介元の申告」として別枠で保持し、社内の同意記録には流用しない（社内で確認して記録する）
            pc.referralConsentClaim = (pc.thirdPartyConsent && pc.thirdPartyConsent.obtained)
              ? { by:p.role, date: pc.thirdPartyConsent.date || todayISO() } : null;
            pc.thirdPartyConsent = { obtained:false, date:'', method:'' };
            pc.followHistory = pc.followHistory || [];
            pc.followHistory.unshift({date:todayISO(), type:'メモ',
              memo:'【受入】'+ROLE_DEFS[p.role].label+'からの紹介を受入'+(pc.referralConsentClaim?'（本人同意は紹介元の申告あり。社内で確認して同意欄に記録してください）':'（本人同意は未確認）')});
            DB.push(pc); save(); refs++;
          }
        }
        return;
      }
      if(dk && pc.domains?.[dk]){
        const localU = c.domains?.[dk]?.updatedAt, remoteU = pc.domains[dk].updatedAt;
        // 提携先が実際に編集した分野（updatedAt あり）だけ取り込む。未編集の返しで社内の判断（共有範囲）を巻き戻さない
        if(!remoteU){ conflict++; }
        else if(localU && remoteU < localU){ conflict++; }
        else { c.domains[dk] = pc.domains[dk]; upd++; }
      }
      if(!c.inheritanceStartDate && pc.inheritanceStartDate) c.inheritanceStartDate = pc.inheritanceStartDate;   // 戸籍を見る専門家の記入を取り込む
      (pc.followHistory||[]).forEach(h=>{
        if(!(c.followHistory||[]).some(x=>x.date===h.date && x.memo===h.memo)){ (c.followHistory=c.followHistory||[]).unshift(h); notes++; }
      });
      upsert(c);
    });
    render();
    toast(ROLE_DEFS[p.role].label+'の更新を反映：'+upd+'件'
      +(conflict?('／競合'+conflict+'件は社内が新しいため未反映'):'')
      +(refs?('／ご紹介の新規受入'+refs+'件'):'')
      +'（新規メモ'+notes+'件）');
  } catch(err){ toast('この返信ファイルを反映できませんでした'); } };
  r.readAsText(f); e.target.value=''; toggleMenu();
}

/* ============================================================
   診断データ → 分野の自動フラグ（“見える化して次の出番が分かる”の核）
   ============================================================ */
function deriveDomains(c){
  const d = c.domains || {};
  const set = (k,v) => d[k] = Object.assign({ need:'undetermined', stage:'未判定', assignee:'', next:'', reason:'' }, d[k], v);
  const types = Array.isArray(c.consultTypes) ? c.consultTypes : [];
  const has  = k => types.includes(k);
  const prop = !!c.hasProperty;   // 不動産（空き家等）のご相談があるか

  // 解体工事
  if(has('demolish')) set('demolition',{ need:'required', stage:d.demolition?.stage||'現地調査', next:'現地調査の日程調整' });
  else set('demolition',{ need:'undetermined', next: prop?'建物の解体意向を確認':'' });

  // 滅失登記（土地家屋調査士）＝解体するときに必ず後工程で発生
  if(has('demolish')) set('demolition_reg',{ need:'required', stage:d.demolition_reg?.stage||'解体完了待ち', next:'解体完了を待って申請（完工＋1ヶ月）' });
  else if(has('regist') && prop) set('demolition_reg',{ need:'undetermined', next:'滅失登記の要否を確認' });
  else set('demolition_reg',{ need:'undetermined', next:'' });

  // 相続登記（司法書士）
  if(has('inherit') || has('regist') || c.owner==='deceased')
    set('inheritance_reg',{ need:'required', stage:d.inheritance_reg?.stage||'名義確認', next: c.owner==='deceased'?'戸籍収集・相続人確定':'相続関係の確認・登記の要否判定' });
  else if(c.owner==='unknown')
    set('inheritance_reg',{ need:'required', stage:d.inheritance_reg?.stage||'名義確認', next:'登記簿取得で名義確定' });
  else if(prop && c.owner==='self') set('inheritance_reg',{ need:'not_required', reason:'名義がご本人のため登記不要' });
  else set('inheritance_reg',{ need:'undetermined', next:'' });

  // 税務（税理士）
  if(has('tax') || has('inherit') || has('sell') || c.exit==='sell' || c.owner==='deceased')
    set('tax',{ need:'required', stage:d.tax?.stage||'課税論点の洗い出し', next: has('inherit')?'相続税の要否・特例の確認':'3000万控除の可否・固定資産税の確認' });
  else set('tax',{ need:'undetermined', next: prop?'固定資産税（住宅用地特例の解除）は後続で確認':'' });

  // 不動産
  if(has('sell') || c.exit==='sell') set('realestate',{ need:'required', stage:d.realestate?.stage||'査定', next:'現況／更地の両建て査定' });
  else if(c.exit==='use') set('realestate',{ need:'not_required', reason:'活用予定のため売却不要' });
  else set('realestate',{ need:'undetermined', next: prop?'出口未定。査定を見て判断':'' });

  // エクステリア・造成・新築
  if(has('use') || c.exit==='use') set('construction_ext',{ need:'required', stage:d.construction_ext?.stage||'活用意向・再建築可否', next:'活用プランと再建築可否の確認' });
  else if(c.exit==='sell') set('construction_ext',{ need:'not_required', reason:'更地渡し・売却のため活用なし' });
  else set('construction_ext',{ need:'undetermined', next: c.garden==='many' ? '外構多め＝再整備需要のシグナル' : '' });

  // FP（資金・保険・補助金）— 高額/緊急に加え、相続・売却・補助金該当も資金と保険の確認が要る
  const high = has('money') || has('inherit') || (Number(c.estimateRangeLow)||0) >= 150 || c.urgencyLevel==='高' || c.owner==='deceased' || c.exit==='sell' || c.subsidyApplicable==='該当あり';
  if(high) set('fp',{ need:'required', stage:d.fp?.stage||'資金ヒアリング', next: has('inherit')?'相続後の資金計画・保険の確認':'資金・火災保険・補助金の確認' });
  else set('fp',{ need:'undetermined', next:'' });

  c.domains = d;
  return c;
}
/* 生年月日→年齢 */
function ageOf(birthday){
  if(!birthday || !DATE_RE.test(birthday)) return null;
  const b = new Date(birthday+'T00:00:00'); if(isNaN(b)) return null;
  const now = new Date();
  let a = now.getFullYear() - b.getFullYear();
  const m = now.getMonth() - b.getMonth();
  if(m < 0 || (m === 0 && now.getDate() < b.getDate())) a--;
  return (a>=0 && a<130) ? a : null;
}

/* ============================================================
   次の戦略エンジン（案件→推奨アクション配列）
   ============================================================ */
function strategyFor(c){
  const out = [];
  const si = stageIndex(c.stage);
  const contacted = (c.followHistory||[]).some(h => h && !h.auto && CONTACT_TYPES.includes(h.type));
  const pastNext = c.nextActionDate && c.nextActionDate < todayISO();

  const types = Array.isArray(c.consultTypes) ? c.consultTypes : [];
  const hasT  = k => types.includes(k);
  const demo  = c.domains?.demolition?.need==='required' || hasT('demolish');

  if(c.stage==='lead' && !contacted)
    out.push({lv: c.urgencyLevel==='高'?'高':'中', t:'まず一次ご連絡（緊急度「高」は4時間以内）。ご相談の全体像とご希望の期限をうかがい、必要な専門家の顔ぶれを確定する。'});
  if(hasT('inherit'))
    out.push({lv:'高', t:'相続案件。①相続人の確定（司法書士）②相続税の申告要否と期限＝相続開始から10ヶ月（税理士）③遺産の全体像（不動産・預貯金・保険）を並行で確認。期限が最も短い論点から着手する。'});
  if(hasT('money') && !hasT('demolish'))
    out.push({lv:'中', t:'資金・保険のご相談。現状の保険と収支を棚卸しし、他分野（相続・不動産）の結論が出る前でも着手できる部分から進める。'});
  if(c.owner==='deceased' && si < stageIndex('contract'))
    out.push({lv:'高', t:'名義が故人のまま。相続登記（司法書士）を前工程で先行し、名義が片付く／相続人全員の同意が取れるまで契約・着工はブロック。現地調査に司法書士を同席。'});
  if(c.owner==='unknown')
    out.push({lv:'高', t:'名義が不明。まず司法書士が登記簿を取得して名義を確定。確定まで契約は保留。'});
  if(c.stage==='hearing' && demo)
    out.push({lv:'高', t:'現地調査の結果（地中埋設物・石綿・私道掘削承諾・残置物）を反映した「確定レンジ見積」へ更新。診断概算からの差分理由を明示。'});
  if(c.exit==='sell')
    out.push({lv:'高', t:'即解体に走らず、不動産査定（現況／更地）と税理士の3000万円控除の可否判定を並行で起票。更地渡しか古家付きかで解体の要否を確定。'});
  if(c.exit==='sell' && (c.builtYear ? c.builtYear<=1981 : c.era==='old') && c.owner==='deceased')
    out.push({lv:'高', t:'被相続人居住用財産3000万円特別控除の本命。相続開始から3年目の年末を逆算し、相続登記→解体→滅失→売買のクリティカルパスを設定。実建築年（1981/5/31以前か）を現地確認のうえ税理士へ。'});
  if(demo && stageIndex(c.stage)>=stageIndex('contract') && (c.insuranceStatus||'unknown')==='unknown' && c.stage!=='closed_lost')
    out.push({lv:'高', t:'解体前に火災保険の解約時期と解約返戻金を確認（建物滅失後は請求できません）。返戻金は資金計画の原資に。FP・保険担当へ。'});
  if(c.exit==='use')
    out.push({lv:'中', t:'エクステリア／造成／新築を起票。解体〜造成を同一重機・仮設で連結受注し原価圧縮。着手前に再建築可否（接道2m・セットバック・用途地域・調整区域）を確認。'});
  if((Number(c.estimateRangeLow)||0) >= 150 && c.urgencyLevel==='高')
    out.push({lv:'中', t:'資金ネックの典型パターン。FPを起票し、空き家解体ローン＋市町補助金の該当を着工前に確認（交付決定前の着工は対象外）。'});
  if(c.stage==='proposal' && pastNext)
    out.push({lv:'中', t:'ご提案後に音信が途絶えている懸念。値引き合戦ではなく、期限のある論点（相続登記・控除期限）とワンストップの手間削減を伝えて再アプローチ。'});
  if(c.stage==='completed' && demo)
    out.push({lv:'高', t:'完工。滅失登記（土地家屋調査士）を完工＋1ヶ月以内で起票、税理士へ固定資産税（住宅用地特例の解除）を通知、出口（売却／活用）へ引継ぎ。3つ同時に発火。'});
  else if(c.stage==='completed')
    out.push({lv:'中', t:'完了。関わった他分野に結果を共有し、次に出番のある専門家（税務・資金・不動産）へバトンを渡す。お客様には次にやることを1枚で案内する。'});
  if(c.subsidyApplicable==='該当あり')
    out.push({lv:'中', t:'補助金は交付決定後に着工する工程で組む（着工後は申請不可の自治体が多い）。着工前準備に「補助金申請済？」ゲートを立てる。'});

  const order = {'高':0,'中':1,'低':2};
  return out.sort((a,b)=> order[a.lv]-order[b.lv]);
}

/* 実際にお客様と接触した記録の種別（自動生成メモを『接触済み』と誤判定しないため） */
const CONTACT_TYPES = ['架電','来店','メール','LINE','現地','面談'];
function daysSince(iso){ if(!iso) return null; return Math.floor((Date.now() - new Date(iso+'T00:00:00').getTime())/86400000); }
function alertsFor(c){
  const a = [];
  const open = c.stage !== 'closed_lost';
  const si = stageIndex(c.stage);
  const contacted = (c.followHistory||[]).some(h => h && !h.auto && CONTACT_TYPES.includes(h.type));

  if(c.stage==='lead' && open){
    const d = daysSince(c.createdAt);
    if(c.urgencyLevel==='高' && !contacted && d!==null && d>=1) a.push({lv:'red', t:'緊急度「高」の新規リードが未接触のまま放置'});
    else if(!contacted && d!==null && d>=1) a.push({lv:'amber', t:'新規リードが24時間以上未接触'});
  }
  if(open && c.nextActionDate && c.nextActionDate < todayISO())
    a.push({lv:'amber', t:'次アクション日を超過（'+esc(c.nextActionDate)+'）'});
  if((c.owner==='deceased'||c.owner==='unknown') && si>=stageIndex('contract') && c.domains?.inheritance_reg?.stage!=='完了')
    a.push({lv:'red', t:'名義が未解決のまま契約以降へ進行（着工不可ブロック）'});
  if((c.stage==='completed'||c.stage==='aftercare') && c.demolitionDate){
    const d = daysSince(c.demolitionDate);
    if(c.domains?.demolition_reg?.stage!=='完了'){
      if(d!==null && d>=30) a.push({lv:'red', t:'滅失登記が期限（完工＋1ヶ月）を超過'});
      else if(d!==null && d>=20) a.push({lv:'amber', t:'滅失登記の期限が接近（完工＋1ヶ月）'});
    }
  }
  const joko = calcJokoDeadline(c);
  if(joko && open){
    if(joko.left<=90) a.push({lv:'red', t:'3000万円控除の期限（'+joko.dateStr+'）まで残り'+joko.left+'日'});
    else if(joko.left<=365) a.push({lv:'amber', t:'3000万円控除の期限（'+joko.dateStr+'）まで残り'+joko.left+'日'});
  }
  // 相続登記の申請義務（2024年義務化・相続を知った日から3年・過料あり）
  if(open && c.owner==='deceased' && c.inheritanceStartDate && c.domains?.inheritance_reg?.stage!=='完了'){
    const d0 = new Date(c.inheritanceStartDate+'T00:00:00');
    const dl = new Date(d0); dl.setFullYear(d0.getFullYear()+3);
    const left = Math.ceil((dl - Date.now())/86400000);
    if(left<=90) a.push({lv:'red', t:'相続登記の申請義務（3年）まで残り'+left+'日'});
    else if(left<=180) a.push({lv:'amber', t:'相続登記の申請義務（3年）まで残り'+left+'日'});
  }
  // 火災保険（滅失後は請求不可・工事前の無保険リスク）
  if(open && c.insuranceStatus==='cancelPlanned' && c.insuranceCancelDate && c.insuranceCancelDate <= todayISO() && (c.domains?.demolition?.stage||'') !== '完工')
    a.push({lv:'amber', t:'火災保険の解約予定日を過ぎています（着工前の建物が無保険の恐れ）'});
  // 分野期日の超過
  DOMAINS.forEach(dm => {
    const d = c.domains?.[dm.key];
    if(open && d && d.need==='required' && d.nextDate && d.nextDate < todayISO() && domainPhase(dm.key,d).key!=='done')
      a.push({lv:'amber', t:dm.label+'の期日を超過（'+esc(d.nextDate)+'）'});
  });
  // 必要分野が未着手
  DOMAINS.forEach(dm => {
    const d = c.domains?.[dm.key];
    if(open && d && d.need==='required' && (!d.stage || d.stage==='未判定')){
      const ds = daysSince(c.createdAt);
      if(ds!==null && ds>=7) a.push({lv:'amber', t:dm.label+'（'+dm.role+'）が必要判定のまま未着手'});
    }
  });
  // 出口ハンドオフ漏れ
  if(open && c.exit==='sell' && (c.domains?.realestate?.need==='undetermined' || c.domains?.tax?.need==='undetermined'))
    a.push({lv:'amber', t:'売却なのに不動産／税理士が未起票'});
  return a;
}

function mapLead(l){
  const c = {
    id: newId(),
    createdAt: l.date || todayISO(),
    source: l.kind==='form' ? '問い合わせフォーム' : '60秒診断',
    name:l.name||'', phone:l.phone||'', email:l.email||'', city:l.city||'',
    desiredConsult:(l.consult||'').slice(0,400), assignee:'', teamNote:'',
    stage:'lead', nextAction:'一次架電・ヒアリング', nextActionDate: todayISO(),
    structure:l.structure||'wood', tsubo:Number(l.tsubo)||null, floors:l.floors||'2f',
    era:l.era||'unknown', road:l.road||'unknown', garden:l.garden||'normal', zanchi:l.zanchi||'half',
    owner:l.owner||'self', exit:l.exit||'undecided',
    urgencyLevel:l.urgencyLevel||'中', urgencyScore:l.urgencyScore||null,
    estimateRangeLow: l.total ? Math.round(l.total*0.85/10000) : null,
    estimateRangeHigh: l.total ? Math.round(l.total*1.15/10000) : null,
    finalEstimate:null, subsidyApplicable:'未確認', asbestosSurvey:'未実施',
    insuranceStatus:'unknown', insuranceCancelDate:null, builtYear:null, address:'', propertyAddress:'', chiban:'', landArea:null, rightType:'', salePriceEstimate:null,
    demolitionDate:null, inheritanceStartDate:null, thirdPartyConsent:{obtained:false,date:'',method:''}, domains:{},
    // LPの空き家診断＝解体のご相談。ここを立てないと解体工事・滅失登記が起票されない
    hasProperty:true,
    consultTypes: (()=>{ const t=['demolish']; const txt=(l.consult||'')+' '+(l.exit||'');
      if(l.owner==='deceased' || /相続|亡く|遺産/.test(txt)) t.push('inherit');
      if(l.exit==='sell' || /売却|売りたい/.test(txt)) t.push('sell');
      if(l.exit==='use' || /活用|新築|駐車場/.test(txt)) t.push('use');
      if(/資金|ローン|補助金|保険/.test(txt)) t.push('money');
      return t; })(),
    followHistory:[{date:todayISO(), type:'メモ', auto:true, memo:'LP診断からの自動読み取りで起票'}], lostReason:null, notes:''
  };
  sanitizeCase(c);
  deriveDomains(c);
  return c;
}
function importLeads(){
  const q = inboxLeads(); if(!q.length) return;
  q.forEach(l => upsert(mapLead(l)));

function discardLeads(){

  const t = todayISO();

  scope().forEach(c=>{
    if(c.stage==='closed_lost') return;
    const al = alertsFor(c);
    const hasRed = al.some(x=>x.lv==='red');
    if(isAdmin() && c.nextActionDate && c.nextActionDate<=t)
      rows.push({c, kind:'core', kindLabel:'商談', color:'#243B33', date:c.nextActionDate, what:c.nextAction||'次アクション', who:c.assignee||'', red:hasRed});
    DOMAINS.forEach(dm=>{
      if(!isAdmin() && roleDomain()!==dm.key) return;
      const d = c.domains?.[dm.key];
      if(d && d.need==='required' && d.nextDate && d.nextDate<=t && domainPhase(dm.key,d).key!=='done')

  ${list || '<div class="bg-white border border-line rounded-2xl p-10 text-center text-sub">今日やることはありません。おつかれさまです。</div>'}`;
}
function completeAndNext(id, kind, ev){
  ev.stopPropagation();
  const c = getC(id); if(!c) return;
  const memo = prompt('完了メモ（フォロー履歴に残ります）','対応済み');
  if(memo===null) return;
  const next = prompt('次の期日（YYYY-MM-DD／空欄で期日なし）', addDaysISO(7));
  if(next===null) return;
  const nd = (next && DATE_RE.test(next.trim())) ? next.trim() : '';
  c.followHistory = c.followHistory||[];
  const who = isAdmin() ? '' : '【'+ROLE_DEFS[ROLE].label+'】';
  c.followHistory.unshift({date:todayISO(), type:'メモ', memo: who+memo});
  if(kind==='core'){ if(canEditCore()) c.nextActionDate = nd; }
  else if(domainMeta(kind) && canEditDomain(kind)){ const d=c.domains[kind]; if(d){ d.nextDate = nd; d.updatedAt = new Date().toISOString(); } }
  markDirty(); upsert(c); render(); toast('✓ 消し込みました'+(nd?('（次回 '+nd+'）'):''));
}

  q = (q||'').trim(); if(!q) return [];
  const qp = q.replace(/[-\s]/g,'');

  return scope().filter(c =>
    (c.name||'').includes(q) || (c.city||'').includes(q) || (c.id||'').toLowerCase().includes(q.toLowerCase()) ||
    (isNum && qp.length>=3 && nrmPhone(c.phone).includes(qp))
  ).slice(0,8);
}

/* ---- 分野別ボード（担当が“自分の番/もうすぐ”を見る） ---- */
function renderPartner(){
  const doms = isAdmin() ? DOMAINS : DOMAINS.filter(dm => dm.key === roleDomain());
  const blocks = doms.map(dm=>{
    const rel = scope().filter(c=>c.stage!=='closed_lost' && c.domains?.[dm.key]?.need==='required');
    const groups = { active:[], done:[] };
    rel.forEach(c=>{ const p = domainPhase(dm.key, c.domains[dm.key]); (groups[p.key]||(groups[p.key]=[])).push(c); });
    const chip = (c)=>{
      const d = c.domains[dm.key];
      const overdue = d.nextDate && d.nextDate < todayISO();
      return `<div class="bg-white border border-line rounded-lg px-3 py-2 mb-1.5 cursor-pointer hover:border-grn" onclick="openDetail('${c.id}')">
        <div class="flex items-center justify-between gap-2">
          <p class="font-bold text-sm truncate">${c.referredBy===dm.key?badge('ご紹介','#fff',dm.color)+' ':''}${esc(c.name||'')}</p>
          <span class="text-[10px] text-sub">${stageMeta(c.stage).label}</span>
        </div>
        <p class="text-[11px] text-sub">${esc(c.city||'')}／担当:${esc(d.assignee||'未割当')}</p>
        ${d.next?`<p class="text-[11px] text-ink mt-0.5">→ ${esc(d.next)}</p>`:''}
        <div class="flex items-center justify-between mt-0.5">
          <p class="text-[10px]" style="color:${dm.color}">ステージ: ${esc(d.stage||'未判定')}</p>
          ${d.nextDate?`<p class="text-[10px] font-bold ${overdue?'text-red':'text-sub'}">期日 ${esc(d.nextDate)}${overdue?'（超過）':''}</p>`:''}
        </div>
      </div>`;
    };
    const byDate = (a,b)=> ((a.domains[dm.key].nextDate||'9999') < (b.domains[dm.key].nextDate||'9999') ? -1 : 1);
    const section = (title,col,arr)=> arr.length?`<div class="mb-2"><p class="text-[11px] font-bold mb-1" style="color:${col}">${title}（${arr.length}）</p>${arr.slice().sort(byDate).map(chip).join('')}</div>`:'';
    return `<div class="bg-paper rounded-2xl border border-line p-3">
      <div class="flex items-center gap-2 mb-3 flex-wrap">
        <span class="w-3 h-3 rounded-full" style="background:${dm.color}"></span>
        <p class="font-black text-sm">${dm.label}</p>
        <span class="text-[11px] text-sub">${dm.role}</span>
        <span class="text-[11px] text-sub ml-auto">対応中 ${groups.active.length}件</span>
      </div>
      ${section('対応中','#2E9E68',groups.active)}
      ${section('完了','#16794C',groups.done)}
      ${(!groups.active.length&&!groups.done.length)?'<p class="text-[11px] text-sub">担当案件なし</p>':''}
    </div>`;
  }).join('');
  return `
  <div class="flex items-center justify-between mb-3">
    <h2 class="font-black text-lg">${isAdmin()?'分野別ボード':'あなたの担当案件'}</h2>
    <p class="text-[11px] text-sub">各分野の担当が、自分の対応中案件と完了案件を一覧できます。</p>
  </div>
  <div class="grid ${isAdmin()?'md:grid-cols-2 xl:grid-cols-3':'max-w-2xl'} gap-3">${blocks}</div>`;
}

/* ---- ダッシュボード ---- */
function renderDashboard(){
  const base = scope();
  const open = base.filter(c=>c.stage!=='closed_lost');
  const leads = base.filter(c=>c.stage==='lead').length;
  const pipelineYen = open.reduce((s,c)=> s + (Number(c.estimateRangeLow)||0), 0);
  const won = base.filter(c=>stageIndex(c.stage)>=stageIndex('contract') && c.stage!=='closed_lost').length;
  const lost = base.filter(c=>c.stage==='closed_lost').length;
  const rate = (won+lost)>0 ? Math.round(won/(won+lost)*100) : 0;
  const urgent = open.filter(c=>c.urgencyLevel==='高').length;

  // アラート集約
  const allAlerts = [];
  base.forEach(c=> alertsFor(c).forEach(a=> allAlerts.push({c,a})));
  allAlerts.sort((x,y)=> (x.a.lv==='red'?0:1)-(y.a.lv==='red'?0:1));

  const tile = (label,val,sub,col)=>`<div class="bg-white rounded-2xl border border-line p-4">
    <p class="text-[11px] text-sub font-bold">${label}</p>
    <p class="font-black text-2xl mt-1" style="color:${col||'#243B33'}">${val}</p>
    ${sub?`<p class="text-[11px] text-sub mt-0.5">${sub}</p>`:''}</div>`;

  // ステージ別件数
  const stageBars = OPEN_STAGES.map(s=>{
    const n = base.filter(c=>c.stage===s.key).length;
    const w = open.length? Math.round(n/Math.max(1,open.length)*100):0;
    return `<div class="flex items-center gap-2 text-xs">
      <span class="w-24 shrink-0 text-sub">${s.label}</span>
      <div class="flex-1 bg-paper rounded-full h-3 overflow-hidden"><div style="width:${Math.max(3,w)}%;background:${s.color}" class="h-3"></div></div>
      <span class="w-6 text-right font-bold">${n}</span>
    </div>`;
  }).join('');

  // 分野別稼働
  const domLoad = DOMAINS.map(dm=>{
    const n = open.filter(c=>c.domains?.[dm.key]?.need==='required').length;
    return `<div class="flex items-center gap-2 text-xs"><span class="w-2.5 h-2.5 rounded-full" style="background:${dm.color}"></span><span class="flex-1">${dm.label}<span class="text-sub">（${dm.role}）</span></span><span class="font-bold">${n}</span></div>`;
  }).join('');

  const alertList = allAlerts.length ? allAlerts.map(({c,a})=>`
    <div class="flex items-center gap-2 px-3 py-2 border-b border-line last:border-0 hover:bg-paper cursor-pointer" onclick="openDetail('${c.id}')">
      <span class="w-2 h-2 rounded-full shrink-0" style="background:${a.lv==='red'?'#E5484D':'#F5A524'}"></span>
      <span class="font-bold text-sm w-32 truncate">${esc(c.name||'')}</span>
      <span class="text-[11px] text-sub w-20 shrink-0">${stageMeta(c.stage).label}</span>
      <span class="text-[13px] flex-1">${esc(a.t)}</span>
    </div>`).join('') : '<p class="px-3 py-6 text-center text-sub text-sm">フォロー漏れアラートはありません。</p>';

  return `
  <h2 class="font-black text-lg mb-3">ダッシュボード</h2>
  <div class="grid grid-cols-2 lg:grid-cols-6 gap-3 mb-4">
    ${tile('受信リード（未対応）', leads+'件', '要初回接触', leads?'#E5484D':'#2E9E68')}
    ${tile('進行中の案件', open.length+'件','','#243B33')}
    ${tile('パイプライン概算', '¥'+pipelineYen+'万','下限合計','#2E9E68')}
    ${tile('成約率', rate+'%', '成約'+won+'／失注'+lost)}
    ${tile('緊急度「高」', urgent+'件','', urgent?'#E5484D':'#2E9E68')}
    ${(()=>{ const refs=base.filter(c=>c.referredBy); const byRole={}; refs.forEach(c=>{ const l=ROLE_DEFS[c.referredBy]?.label||c.referredBy; byRole[l]=(byRole[l]||0)+1; });
      return tile('提携先からのご紹介', refs.length+'件', Object.entries(byRole).map(([k,v])=>esc(k)+v).join('・')||'双方向お繋ぎの実績', '#8B5CF6'); })()}
  </div>
  <div class="grid lg:grid-cols-3 gap-3">
    <div class="bg-white rounded-2xl border border-line p-4 lg:col-span-1">
      <p class="font-black text-sm mb-3">ステージ別 件数</p><div class="space-y-2">${stageBars}</div>
    </div>
    <div class="bg-white rounded-2xl border border-line p-4 lg:col-span-1">
      <p class="font-black text-sm mb-3">分野別 稼働案件</p><div class="space-y-2">${domLoad}</div>
    </div>
    <div class="bg-white rounded-2xl border border-line lg:col-span-1 overflow-hidden">
      <p class="font-black text-sm px-4 pt-4 pb-2">フォロー漏れアラート <span class="text-sub font-bold">${allAlerts.length}</span></p>
      <div>${alertList}</div>
    </div>
  </div>`;
}

function markDirty(){ if(!isAdmin()) localStorage.setItem('akiya_crm_dirty', todayISO()); }
/* 診断値の変更→分野の要否を再判定（手動の判断は壊さないガード付き） */
function rederiveDomains(c){
  const keep = JSON.parse(JSON.stringify(c.domains||{}));
  deriveDomains(c);
  Object.keys(keep).forEach(k=>{
    const was = keep[k], now = c.domains[k];
    if(!was || !now) return;
    if(was.manualNeed){ c.domains[k]=was; return; }                                    // 登録フォーム等での明示的な判断は自動再判定で動かさない
    if(was.need==='required' && now.need!=='required'){ c.domains[k]=was; return; }   // 手動/既定の「必要」は降格させない
    if(was.need==='hold'){ c.domains[k]=was; return; }                                 // 手動保留は維持
    ['assignee','next','nextDate','data','updatedAt'].forEach(p=>{ if(was[p]!=null && was[p]!=='' && (now[p]==null||now[p]==='')) now[p]=was[p]; });
    if(was.stage && was.stage!=='未判定' && now.need==='required') now.stage = was.stage;
    if(was.need==='not_required' && now.need==='not_required' && was.reason) now.reason = was.reason;
  });
  return c;
}
function coreSelect(id,key,value){

/* 提携先が「当方では対応不要」を申し送る（共有範囲は変えない＝案件が自分の画面から消えない・社内へ必ず返る） */
function declineDomain(id,dkey){
  if(!canEditDomain(dkey) || isAdmin()) return;
  const c = getC(id); if(!c) return;
  const meta = domainMeta(dkey);
  const r = prompt(meta.label+'について「当方では対応不要」と事務局へ申し送ります。\n理由をご記入ください（この内容はチームに共有されます）。', '');
  if(r===null) return;
  const d = c.domains[dkey] = c.domains[dkey] || {need:'required',stage:'未判定',assignee:'',next:'',reason:''};
  d.decline = { reason:(r||'').trim()||'当方では対応不要', date:todayISO(), by:ROLE };
  d.updatedAt = new Date().toISOString();
  c.followHistory = c.followHistory || [];
  c.followHistory.unshift({date:todayISO(), type:'メモ', memo:'【'+ROLE_DEFS[ROLE].label+'】当方では対応不要として申し送り：'+d.decline.reason});
  markDirty(); upsert(c); savedFlash(); renderDetail();
  toast('申し送りを記録しました。「自分の更新を書き出して返信」で事務局へお送りください');
}
/* 社内が申し送りを確認済みにする（共有を外すかは別途チームチップで判断） */
function clearDecline(id,dkey){
  if(!canEditCore()) return;
  const c = getC(id); const d = c && c.domains && c.domains[dkey]; if(!d || !d.decline) return;
  d.declineAck = { date: todayISO(), reason: d.decline.reason||'', by: d.decline.by||null };
  delete d.decline;
  d.updatedAt = new Date().toISOString();
  upsert(c); savedFlash(); renderDetail();
}
/* 関わるチームの切替（＝共有範囲。不要にするときは理由を必ず残す） */
function toggleTeam(id,dkey){
  if(!canEditCore()) return;
  const c = getC(id); if(!c) return;
  c.domains = c.domains || {};
  const d = c.domains[dkey] = c.domains[dkey] || {need:'undetermined',stage:'未判定',assignee:'',next:'',reason:''};
  const meta = domainMeta(dkey);
  if(d.need==='required'){
    const r = prompt(meta.label+'（'+meta.role+'）を「共有しない」に変更します。\nチームに残す理由を入力してください。', d.reason||'');
    if(r===null) return;
    d.need='not_required'; d.reason=(r||'').trim()||'今回は関わらない（共有対象外）'; d.stage='未判定';

function renderDetail(){
  const c = getC(openId); if(!c) return;
  // フォローメモの下書きを退避（再描画で消えないように）
  const fhDraft = document.getElementById('fh-memo')?.value || '';
  const fhTypeSel = document.getElementById('fh-type')?.value || '';
  const si = stageIndex(c.stage);
  const sMeta = stageMeta(c.stage);
  const isLost = c.stage==='closed_lost';
  const prog = isLost ? 0 : Math.round(si/(OPEN_STAGES.length-1)*100);
  const strat = strategyFor(c);
  const al = alertsFor(c);
  const stageOpts = STAGES.map(s=>`<option value="${s.key}" ${c.stage===s.key?'selected':''}>${s.label}</option>`).join('');

  /* --- 商談ステッパー（大きめ・クリックで移動） --- */
  const stepper = OPEN_STAGES.map((s,i)=>{
    const done = !isLost && i < si, cur = !isLost && i===si;
    return `<button ${canEditCore()?`onclick="field('${c.id}','stage','${s.key}')"`:'disabled'} title="${s.label}" class="flex flex-col items-center gap-1.5 shrink-0" style="min-width:72px">
      <span class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-black transition-all" style="background:${cur?s.color:(done?'#DCF1E5':'#EEF1F4')};color:${cur?'#fff':(done?'#16794C':'#8A98A5')};${cur?'box-shadow:0 0 0 4px '+s.color+'33':''}">${done?'✓':i+1}</span>

    </button>`;

  /* --- 次の戦略 --- */
  const stratHtml = strat.length ? strat.map(s=>{
    const col = s.lv==='高'?'#E5484D':s.lv==='中'?'#F0862B':'#2E9E68';
    const bg  = s.lv==='高'?'#FDECEC':s.lv==='中'?'#FFF1DE':'#E7F6EC';
    return `<div class="rounded-xl px-4 py-3 mb-2" style="background:${bg}"><p class="text-sm leading-relaxed"><span class="font-black" style="color:${col}">［${s.lv}］</span> ${esc(s.t)}</p></div>`;
  }).join('') : '<p class="text-sm text-sub">現時点の推奨アクションはありません。</p>';

  /* --- 関わるチーム（共有範囲）のチップ --- */
  const teamChips = DOMAINS.map(dm=>{
    const dd = c.domains?.[dm.key];
    const on = dd?.need==='required';
    const tip = on ? (dm.label+'：共有中（'+dm.role+'）') : (dm.label+'：'+(dd?.reason||'共有しない'));
    return `<button ${canEditCore()?`onclick="toggleTeam('${c.id}','${dm.key}')"`:'disabled'} title="${esc(tip)}"

      style="${on?`background:${dm.color};border-color:${dm.color};color:#fff`:'background:#F1F4F2;border-color:#E2E9E3;color:#8A98A5'}">
      ${dm.label}${on?'':'（共有しない）'}</button>`;

  /* --- 6分野（1行1分野・進捗バーつき・役割で編集可否） --- */
  const ro = (labelTxt, val) => `<div><p class="text-xs text-sub font-bold">${labelTxt}</p><p class="mt-1 text-[15px] px-2.5 py-2 rounded-lg bg-paper">${val?esc(val):'—'}</p></div>`;
  const domainRows = DOMAINS.map(dm=>{
    const d = c.domains?.[dm.key] || {need:'undetermined',stage:'未判定',assignee:'',next:'',reason:''};
    const ph = domainPhase(dm.key, d);
    const editable = canEditDomain(dm.key);
    const mine = !isAdmin() && roleDomain()===dm.key;
    const needSel = Object.keys(NEEDS).map(k=>`<option value="${k}" ${d.need===k?'selected':''}>${NEEDS[k].label}</option>`).join('');
    const stageSel = dm.stages.map(s=>`<option ${d.stage===s?'selected':''}>${s}</option>`).join('');
    const stIdx = dm.stages.indexOf(d.stage);
    const stPct = d.need==='required' && stIdx>0 ? Math.round(stIdx/(dm.stages.length-1)*100) : 0;
    const dim = (d.need==='not_required') ? 'opacity-70' : '';
    let controls;
    if(editable){
      // 要否＝共有範囲の最終判断は社内のみ。提携先は「当方では対応不要」を申し送る（案件は消えず、社内へ必ず返る）
      const needCtl = canEditCore()
        ? `<label class="text-xs text-sub font-bold">要否

        : `<div class="text-xs text-sub font-bold">要否
          <p class="mt-1 text-[15px] px-2.5 py-2 rounded-lg bg-paper">${NEEDS[d.need]?.label||'—'}</p>
          ${d.decline
            ? `<p class="text-[11px] mt-1" style="color:#B45309">対応不要として申し送り済み（${esc(d.decline.date||'')}）</p>`
            : `<button onclick="declineDomain('${c.id}','${dm.key}')" class="text-[11px] font-bold border border-line rounded-full px-2.5 py-1 mt-1 hover:bg-paper">当方では対応不要として申し送る</button>`}

      controls = `<div class="grid grid-cols-2 xl:grid-cols-5 gap-2.5">
        ${needCtl}
        ${d.need==='not_required' ? `
        <label class="text-xs text-sub font-bold col-span-1 xl:col-span-4">不要の理由（チームに共有）

        <label class="text-xs text-sub font-bold">進捗ステージ
          <select onchange="domField('${c.id}','${dm.key}','stage',this.value)" class="w-full border border-line rounded-lg px-2.5 py-2 text-[15px] font-medium mt-1" ${d.need!=='required'?'disabled':''}>${stageSel}</select>
        </label>
        <label class="text-xs text-sub font-bold">担当
          ${(()=>{ const def=DOM_ASSIGNEE[dm.key];
            if(!def) return `<input value="${esc(d.assignee||'')}" onchange="domField('${c.id}','${dm.key}','assignee',this.value)" placeholder="担当者名" class="w-full border border-line rounded-lg px-2.5 py-2 text-[15px] mt-1">`;
            const other=!!(d.assignee&&d.assignee!==def);
            return `<select onchange="assigneePick('${c.id}','${dm.key}',this.value)" class="w-full border border-line rounded-lg px-2.5 py-2 text-[15px] font-medium mt-1">

  /* --- 建物・診断データ --- */

        <div class="flex items-center gap-2 flex-wrap">

        </div>
        <p class="text-xs text-sub">${esc(c.id)}・${esc(c.city||'')}</p>
      </div>
      <div class="ml-auto flex items-center gap-1.5 shrink-0">
        ${c.phone?`<a href="tel:${esc(c.phone)}" class="hidden sm:flex items-center gap-1.5 border border-grn text-grn font-bold text-sm rounded-full px-4 py-2 hover:bg-grnL">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h2.1a1 1 0 01.98.8l.72 3.61a1 1 0 01-.27.9L7.2 9.6a12.05 12.05 0 007.2 7.2l1.29-2.33a1 1 0 01.9-.27l3.61.72a1 1 0 01.8.98V19a2 2 0 01-2 2h-1C9.72 21 3 14.28 3 6V5z"/></svg>
          ${esc(c.phone)}</a>`:''}
        ${canEditCore()?`<button onclick="openShareModal('${c.id}')" class="flex items-center gap-1.5 bg-grn text-white font-bold text-sm rounded-full px-4 py-2 hover:opacity-90">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 12v7a1 1 0 001 1h14a1 1 0 001-1v-7M16 6l-4-4-4 4M12 2v13"/></svg>
          提携先へ送る</button>
        <button onclick="delCustomer('${c.id}')" class="text-xs text-red border border-red/40 rounded-full px-3 py-2 hover:bg-red/5">削除</button>`:''}
      </div>
    </div>
  </div>

  <div class="max-w-[1240px] mx-auto p-4 sm:p-6 space-y-4">

    <!-- チーム共有の注意点 -->
    <div class="rounded-2xl border-2 p-4" style="border-color:#F5A524;background:#FFF7E6">
      <p class="font-black text-sm flex items-center gap-2 mb-2" style="color:#B45309">
        <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.3 3.4a2 2 0 001.74 2.85h15.12a2 2 0 001.74-2.85L13.74 4.94a2 2 0 00-3.48 0L2.7 16.15zM12 17h.01"/></svg>
        チーム共有の注意点（全担当がここを最初に見る）
      </p>
      ${canEditCore()
        ? `<textarea rows="2" onchange="fieldNoRerender('${c.id}','teamNote',this.value); render();" placeholder="例）ご近所トラブル歴あり・近隣挨拶は丁寧に／連絡は夕方以降が繋がりやすい／キーマンは長男様 など" class="w-full bg-white border rounded-xl px-3.5 py-2.5 text-[15px] leading-relaxed" style="border-color:#F5A52466">${esc(c.teamNote||'')}</textarea>`
        : `<p class="bg-white rounded-xl px-3.5 py-2.5 text-[15px] leading-relaxed" style="border:1px solid #F5A52466">${c.teamNote?esc(c.teamNote):'（注意点の記載はありません）'}</p>`}
    </div>

    <div class="grid xl:grid-cols-5 gap-4">
      <!-- 左：進捗と戦略（min-w-0 が無いとステッパーの min-content 幅でカードが広がり、スマホで横スクロールする） -->
      <div class="xl:col-span-3 space-y-4 min-w-0">

        <!-- ご相談の進捗 -->
        <div class="bg-white rounded-2xl border border-line p-5">
          <div class="flex items-center justify-between gap-3 mb-2 flex-wrap">
            <p class="font-black text-sm text-sub">ご相談の進捗</p>
            ${canEditCore()?`<select onchange="field('${c.id}','stage',this.value)" class="border border-line rounded-lg px-3 py-2 text-sm font-bold">${stageOpts}</select>`:''}
          </div>
          <div class="flex items-end gap-3 mb-2">
            <p class="font-black text-2xl" style="color:${sMeta.color}">${sMeta.label}</p>
            ${isLost?'':`<p class="text-sm text-sub font-bold mb-1">全体進捗 ${prog}%</p>`}
          </div>
          <div class="h-2.5 bg-paper rounded-full overflow-hidden mb-5"><div class="h-2.5 rounded-full transition-all" style="width:${isLost?100:prog}%;background:${sMeta.color}"></div></div>
          <div class="flex items-start overflow-x-auto pb-2">${stepper}</div>
          ${canEditCore()?`<div class="grid sm:grid-cols-3 gap-2.5 mt-4 pt-4 border-t border-line">
            <label class="text-xs text-sub font-bold">事務局の担当<input value="${esc(c.assignee||'')}" onchange="fieldNoRerender('${c.id}','assignee',this.value)" class="w-full border border-line rounded-lg px-2.5 py-2 text-[15px] mt-1"></label>
            <label class="text-xs text-sub font-bold">次アクション<input value="${esc(c.nextAction||'')}" onchange="fieldNoRerender('${c.id}','nextAction',this.value)" class="w-full border border-line rounded-lg px-2.5 py-2 text-[15px] mt-1"></label>
            <label class="text-xs text-sub font-bold">次アクション日<input type="date" value="${esc(c.nextActionDate||'')}" onchange="field('${c.id}','nextActionDate',this.value)" class="w-full border border-line rounded-lg px-2.5 py-2 text-[15px] mt-1"></label>
          </div>`:`<div class="grid sm:grid-cols-3 gap-2.5 mt-4 pt-4 border-t border-line text-[15px]">
            <div><p class="text-xs text-sub font-bold">事務局の担当</p><p class="mt-1">${esc(c.assignee||'—')}</p></div>
            <div><p class="text-xs text-sub font-bold">次アクション</p><p class="mt-1">${esc(c.nextAction||'—')}</p></div>
            <div><p class="text-xs text-sub font-bold">次アクション日</p><p class="mt-1">${esc(c.nextActionDate||'—')}</p></div>
          </div>`}
        </div>

        <!-- 次の戦略 -->
        <div class="bg-white rounded-2xl border border-line p-5">
          <p class="font-black text-[15px] mb-3 flex items-center gap-2">
            <svg class="w-5 h-5 text-org" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
            次の戦略（自動サジェスト）
          </p>
          ${stratHtml}
        </div>

        <!-- 関わるチーム＝共有範囲 -->
        <div class="bg-white rounded-2xl border border-line p-5">
          <div class="flex items-center justify-between gap-2 flex-wrap mb-1.5">
            <p class="font-black text-[15px]">この案件に関わるチーム（共有範囲）</p>
            ${canEditCore()?`<button onclick="openShareModal('${c.id}')" class="text-xs font-bold border border-grn text-grn rounded-full px-3.5 py-1.5 whitespace-nowrap">この案件を関係者へ書き出す</button>`:''}
          </div>
          <p class="text-[11px] text-sub mb-3">色つき＝共有中（この専門家がお客様情報を見られます）／グレー＝共有しない。${canEditCore()?'ボタンで切り替えできます。':'変更は事務局が行います。'}<br>※ 共有をOFFにしても、すでにお渡し済みのファイルは相手の手元に残ります（今後の共有を止める設定です）。</p>
          <div class="flex flex-wrap gap-1.5">${teamChips}</div>

        <!-- 6分野 -->
        <div>
          <p class="font-black text-[15px] mb-2">各分野の連携状況 <span class="text-xs text-sub font-bold">（順不同で並行して動く・不要は理由を記録して共有）</span></p>
          <div class="space-y-2.5">${domainRows}</div>
        </div>
      </div>

      <!-- 右：お客様情報・記録 -->

          ${(() => { const age = ageOf(c.birthday);
            const row = (l,v) => `<div class="flex items-start gap-2"><span class="text-xs text-sub w-14 shrink-0 mt-0.5">${l}</span><span class="font-bold break-all">${v}</span></div>`;
            const fam = c.family ? [c.family.spouse?'配偶者あり':'', (Number(c.family.children)||0)>0?('お子様'+c.family.children+'名'):''].filter(Boolean).join('・') : '';
            return `<div class="space-y-2 text-[15px]">
              ${c.kana?row('カナ', esc(c.kana)):''}
              ${(c.birthday||c.gender)?row('生年月日', (c.birthday?esc(c.birthday):'—')+(age!=null?`<span class="text-grn">（${age}歳）</span>`:'')+(c.gender?('　'+esc(c.gender)):'')):''}
              <div class="flex items-start gap-2"><span class="text-xs text-sub w-14 shrink-0 mt-0.5">電話</span><span class="font-black">${c.phone?`<a href="tel:${esc(c.phone)}" class="text-grn">${esc(c.phone)}</a>`:'—'}${c.mobile?`　<a href="tel:${esc(c.mobile)}" class="text-grn">${esc(c.mobile)}</a>`:''}</span></div>

          ${(Array.isArray(c.consultTypes)&&c.consultTypes.length)?`<div class="mt-3 flex flex-wrap gap-1">${c.consultTypes.map(k=>{ const t=CONSULT_TYPES.find(x=>x.key===k); return t?`<span class="text-[11px] font-bold px-2.5 py-1 rounded-full text-white" style="background:${t.color}">${t.label}</span>`:''; }).join('')}</div>`:''}

function delCustomer(id){ if(!canEditCore()) return; if(!confirm('この案件を削除しますか？')) return; DB=DB.filter(c=>c.id!==id); save(); closeDetail(); }

function openNew(){ openIntake(); }
function openIntake(){
  const t = document.getElementById('newTitle');
  if(t) t.textContent = isAdmin() ? 'お客様を登録' : 'お客様を登録（チームへ共有）';
  document.getElementById('newModal').classList.remove('hidden');
  renderIntake();
  setTimeout(()=>{ const n=document.getElementById('n-name'); if(n) n.focus(); }, 30);
}

/* フォームの入力内容を案件オブジェクトの形にする（推奨計算と保存で必ず同じ値を使うための唯一の変換口） */
function intakeDraft(){
  const hasProp = !!document.getElementById('n-hasprop')?.checked;
  return {
    consultTypes: pickedConsults(), hasProperty: hasProp,
    owner: hasProp?val('n-owner'):'', exit: hasProp?val('n-exit'):'',

    garden: hasProp?val('n-garden'):'',

function intakeRecommend(auto){
  if(!auto) intakeTouched = new Set();   // 手動の「推奨をセット」＝それまでの個別指定をリセットする操作
  const tmp = intakeDraft();
  deriveDomains(tmp);
  const myKey = isAdmin() ? null : roleDomain();
  DOMAINS.forEach(dm=>{
    const cb = document.getElementById('sv-'+dm.key); if(!cb) return;
    if(dm.key===myKey){ cb.checked = true; }
    else {
      if(auto && intakeTouched.has(dm.key)) return;
      cb.checked = tmp.domains[dm.key] && tmp.domains[dm.key].need === 'required';
    }
    const rs = document.getElementById('svr-'+dm.key); if(rs) rs.classList.toggle('hidden', cb.checked);
  });
}
function val(id){ const e=document.getElementById(id); return e?e.value:''; }
function parsePaste(){
  const raw = val('paste').trim(); if(!raw) return;
  // JSON優先
  try {
    const j = JSON.parse(raw);
    const map = {city:'n-city',structure:'n-structure',tsubo:'n-tsubo',floors:'n-floors',era:'n-era',road:'n-road',garden:'n-garden',zanchi:'n-zanchi',owner:'n-owner',exit:'n-exit'};
    Object.keys(map).forEach(k=>{ if(j[k]!=null){ const e=document.getElementById(map[k]); if(e) e.value=j[k]; } });
    if(j.urgencyLevel){ const e=document.getElementById('n-urg'); if(e) e.value=j.urgencyLevel; }
    if(j.total){ document.getElementById('n-lo').value=Math.round(j.total*0.85/10000); document.getElementById('n-hi').value=Math.round(j.total*1.15/10000); }
    intakeRecommend(true);
    toast('診断JSONを取り込みました（関わるチームの推奨も更新）'); return;
  } catch(e){}
  // テキスト（LPの診断サマリー／相談メール形式を全項目パース）
  const m = (re)=>{ const x=raw.match(re); return x?x[1].trim():''; };
  const put = (id,v)=>{ if(v){ const e=document.getElementById(id); if(e) e.value=v; } };
  put('n-name',  m(/お名前[:：]\s*(.+)/));
  put('n-phone', m(/電話[:：]\s*(.+)/));
  put('n-email', m(/メール[:：]\s*(.+)/));
  put('n-city',  m(/所在地[:：]\s*(.+)/));
  const tsubo = m(/約(\d+)坪/); put('n-tsubo', tsubo);
  const pickKey = (grp, text) => { for(const k of Object.keys(L[grp])){ if(text.includes(L[grp][k])) return k; } return ''; };
  put('n-structure', pickKey('structure', raw));
  if(/平屋/.test(raw)) put('n-floors','1f'); else if(/3階/.test(raw)) put('n-floors','3f'); else if(/2階/.test(raw)) put('n-floors','2f');
  if(/2006年以降/.test(raw)) put('n-era','new'); else if(/1990/.test(raw)) put('n-era','mid'); else if(/1989年以前/.test(raw)) put('n-era','old'); else if(/築年不明/.test(raw)) put('n-era','unknown');
  if(/広い（4m|広い\(4m/.test(raw)) put('n-road','wide'); else if(/軽なら通れる/.test(raw)) put('n-road','mid'); else if(/狭い（2m|狭い\(2m/.test(raw)) put('n-road','narrow'); else if(/前面道路[:：]不明/.test(raw)) put('n-road','unknown');
  if(/外構ほぼなし/.test(raw)) put('n-garden','none'); else if(/外構少なめ/.test(raw)) put('n-garden','few'); else if(/外構多め/.test(raw)) put('n-garden','many'); else if(/外構一般的/.test(raw)) put('n-garden','normal');
  if(/残置物ほぼなし/.test(raw)) put('n-zanchi','empty'); else if(/残置物ほぼそのまま/.test(raw)) put('n-zanchi','full'); else if(/残置物/.test(raw)) put('n-zanchi','half');
  if(/亡くなった|故人/.test(raw)) put('n-owner','deceased');
  else if(/名義は不明|名義[:：]不明/.test(raw)) put('n-owner','unknown');
  else if(/名義はご本人/.test(raw)) put('n-owner','self');
  if(/売却/.test(raw)) put('n-exit','sell'); else if(/活用/.test(raw)) put('n-exit','use');
  const rng = raw.match(/概算[:：]\s*([0-9,]+)万〜([0-9,]+)万/);
  if(rng){ put('n-lo', rng[1].replace(/,/g,'')); put('n-hi', rng[2].replace(/,/g,'')); }
  const consult = m(/希望する相談[:：]\s*(.+)/); if(consult) put('n-consult','【希望】'+consult);
  intakeRecommend(true);
  toast('診断テキストから全項目を取り込みました（関わるチームの推奨も更新。内容をご確認ください）');
}
/* 登録の確定（事務局＝そのまま台帳へ／提携先＝自分のお客様を登録してチームへ送客）
   チェックした分野＝その専門家に共有され「必要」になる。外した分野＝共有されず「不要（理由つき）」。 */
function applyTeamChecks(c){
  const myKey = isAdmin() ? null : roleDomain();
  const rec = { domains:{}, consultTypes:c.consultTypes, hasProperty:c.hasProperty, owner:c.owner, exit:c.exit,
    urgencyLevel:c.urgencyLevel, estimateRangeLow:c.estimateRangeLow, garden:c.garden, subsidyApplicable:c.subsidyApplicable };
  deriveDomains(rec);
  DOMAINS.forEach(dm=>{
    const cb = document.getElementById('sv-'+dm.key);
    const on = dm.key===myKey ? true : !!(cb && cb.checked);
    const recommended = rec.domains[dm.key] && rec.domains[dm.key].need==='required';
    const d = c.domains[dm.key] = c.domains[dm.key] || {need:'undetermined', stage:'未判定', assignee:'', next:'', reason:''};
    // 推奨と違う判断・理由を書いて外した分野は「人が決めた」として固定（推奨どおりの分野は状況変化で自動再判定させる）
    const typedReason = ((document.getElementById('svr-'+dm.key)||{}).value||'').trim();
    if(on !== recommended || (!on && typedReason)) d.manualNeed = true;
    if(on){
      d.need = 'required'; d.reason = '';
      if(dm.key===myKey) d.assignee = val('n-assignee') || d.assignee || DOM_ASSIGNEE[dm.key] || '';   // 登録者が入力した担当名を最優先
      else if(!d.assignee && DOM_ASSIGNEE[dm.key]) d.assignee = DOM_ASSIGNEE[dm.key];
    } else {
      // 「推奨されたのに外した」「自分で触って外した」＝明示的に不要。触っていない未推奨は自動判定（未判定）のまま残す
      if(recommended || intakeTouched.has(dm.key) || typedReason){
        d.need = 'not_required';
        d.reason = typedReason || '登録時に「今回は関わらない」と選択';
        d.stage = '未判定';
      }
    }
  });
  return c;
}

function importJSON(e){
  const f = e.target.files[0]; if(!f) return;
  if(localStorage.getItem('akiya_crm_locked_role')){
    if(!confirm('この端末は「'+(ROLE_DEFS[localStorage.getItem('akiya_crm_locked_role')]?.label||'提携先')+'モード」に固定されています。\n全データJSONを読み込むと固定が解除され、事務局モードに切り替えられる状態になります。\n\n※ 事務局から受け取った共有ファイルを開く場合は、こちらではなく「提携先データを受け取る」をお使いください。\n\n続行しますか？')){ e.target.value=''; toggleMenu(); return; }
  }
  const r = new FileReader();
  r.onload = ()=>{ try {
    const arr = JSON.parse(r.result); if(!Array.isArray(arr)) throw 0;
    const ids = new Set(DB.map(c=>c.id));
    let add=0,upd=0,skip=0;
    arr.forEach(c=>{
      sanitizeCase(c);
      if(ids.has(c.id)){
        const i=DB.findIndex(x=>x.id===c.id);
        if(DB[i].updatedAt && c.updatedAt && c.updatedAt < DB[i].updatedAt){ skip++; return; }   // 古いデータで巻き戻さない
        DB[i]=c; upd++;
      } else { DB.push(c); add++; }
    });
    save();
    localStorage.removeItem('akiya_crm_locked_role');   // 正規の全データ読み込み＝役割ロック解除
    localStorage.removeItem('akiya_crm_dirty');
    applyRoleUI(); render();
    toast(`統合：新規${add}件・更新${upd}件`+(skip?('・古いためスキップ'+skip+'件'):''));
  } catch(err){ toast('読み込みに失敗しました（JSON形式をご確認ください）'); } };
  r.readAsText(f); e.target.value=''; toggleMenu();
}
function wipe(){ if(!confirm('全データを消去します。よろしいですか？（書き出しでバックアップ推奨）')) return; DB=[]; save(); render(); toggleMenu(); }

// 検索の配線（150msデバウンス・Enterで1件目を開く・Escで閉じる）
(function(){
  const box = document.getElementById('searchBox');
  let t;
  box.addEventListener('input', ()=>{ clearTimeout(t); t=setTimeout(renderSearchDrop, 150); });
  box.addEventListener('keydown', e=>{
    if(e.key==='Enter'){ const hits=searchCases(box.value); if(hits.length) openFromSearch(hits[0].id); }
    if(e.key==='Escape'){ document.getElementById('searchDrop').classList.add('hidden'); box.blur(); }
  });
  document.addEventListener('click', e=>{ if(!e.target.closest('#searchBox') && !e.target.closest('#searchDrop')) document.getElementById('searchDrop').classList.add('hidden'); });
})();
